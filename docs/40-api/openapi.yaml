        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/substitutions':
    post:
      operationId: v1.substitutions.store
      description: "Only that item. The order moves to awaiting_substitution, from which the\nremaining items can still be priced — one out-of-stock line must not\nstall the whole order, or pharmacists work around the system instead of\nwith it."
      summary: 'A pharmacist proposes a substitute, and the affected item blocks'
      tags:
