                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
