        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/notifications:
    get:
      operationId: v1.notifications.index
      description: "The question behind this endpoint is \"was the patient told?\", which\narrives after a missed appointment, an uncollected order or a complaint."
      summary: 'What the clinic actually sent'
      tags:
        - Notification
      parameters:
        -
          name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        -
          name: channel
          in: query
          schema:
            $ref: '#/components/schemas/NotificationChannel'
        -
          name: template_key
          in: query
          description: "The catalogue is a closed list, so an unknown key is a client bug\nrather than an empty result set to puzzle over."
          schema:
            type: string
            enum:
              - registration.otp
              - appointment.confirmed
              - appointment.reminder
              - appointment.cancelled
              - payment.succeeded
              - payment.failed
              - prescription.ready
              - order.priced
              - order.ready_for_pickup
              - delivery.on_its_way
              - delivery.completed
              - results.available
              - staff.invitation
        -
          name: from
          in: query
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          schema:
            type: string
            format: date
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: cursor
          in: query
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `OutboundNotificationResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboundNotificationResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
