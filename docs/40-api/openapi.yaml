          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/patients:
    get:
      operationId: v1.patients.index
      description: "Cursor pagination, not offset: front desk pages through this while walk-in\nregistrations are being created beside them, and offsets duplicate and\nskip rows under exactly that traffic."
      summary: "The clinic's patient list"
      tags:
        - Patient
      parameters:
        -
          name: status
          in: query
          schema:
            $ref: '#/components/schemas/PatientStatus'
      responses:
