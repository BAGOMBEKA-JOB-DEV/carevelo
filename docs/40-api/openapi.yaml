      operationId: v1.patients.update
      description: "`status` is not writable here by design. States move through consent\ndecisions, not through a field assignment."
      summary: "Correct a patient's details"
      tags:
        - Patient
      parameters:
        -
          name: patient
          in: path
          required: true
          description: 'The patient ID'
