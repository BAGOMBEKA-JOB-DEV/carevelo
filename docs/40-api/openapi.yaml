        email_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        tenant_id:
          type:
            - string
            - 'null'
        phone:
          type:
            - object
            - 'null'
        phone_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        is_active:
          type: boolean
      required:
        - id
        - name
        - email
        - email_verified_at
        - created_at
        - updated_at
