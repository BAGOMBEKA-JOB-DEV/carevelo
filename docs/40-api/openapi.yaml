    RecordFulfilmentRequest:
      type: object
      description: "How the patient wants their medicines: collected, or delivered.\n\nTwo values and no default. A default here would be a guess about something the\npatient has to be asked -- and if the guess were `delivery`, it would be a\nguess that their address may be shared with a rider."
      properties:
        method:
          type: string
          enum:
            - pickup
            - delivery
      required:
        - method
      title: RecordFulfilmentRequest
    RecordModeRequest:
      type: object
      description: "Recording the mode a consultation is actually being conducted in.\n\nAny of the three remote modes is accepted, in either direction: the state\nmachine allows conditions to improve as well as degrade, and a record that\nonly admits degradation would be no more truthful than one that admits\nneither.\n\n`in_person` is deliberately not accepted. A remote consultation does not\nbecome an in-person one by changing a field -- that is the\n`converted_to_in_person` outcome, which also forbids prescribing."
      properties:
        mode:
          type: string
          description: "Voice and chat are FIRST-CLASS modes, not degraded fallbacks. A patient on a poor connection -- which in this market is a large share of them at any moment -- must be able to choose voice deliberately rather than fight a failing video call.\n"
          enum:
            - video
            - voice
            - chat
      required:
        - mode
      title: RecordModeRequest
    RegistrationBody:
      type: string
      description: "The three Ugandan registers a clinician can be on. CAPTURED, NEVER VERIFIED. Carevelo has no access to the UMDPC, AHPC or Nurses & Midwives registers and no API exists to check one against, so the value a clinic records is its own attestation and every surface showing it must say so. Automated licence verification is explicitly out of scope for H1, because implying a check we never performed would be worse than recording an attestation honestly.  The COLUMN is deliberately not cast to this enum. `registration_body` is snapshotted onto a prescription at the moment of issue, and that snapshot is part of a document a clinic may have to produce years later -- it has to reproduce exactly what was recorded, including rows written before this enum existed and rows written in a different case. So the enum guards the WAY IN, at validation, and reads stay plain strings.\n| |\n|---|\n| `umdpc` <br/> Uganda Medical and Dental Practitioners Council. |\n| `ahpc` <br/> Allied Health Professionals Council. |\n| `nurses_midwives` <br/> Uganda Nurses and Midwives Council. |"
      enum:
        - umdpc
        - ahpc
        - nurses_midwives
      title: RegistrationBody
    RejectDispenseOrderRequest:
      type: object
      description: "The pharmacy declining to fill an order.\n\nA reason is required. An order that simply stops, with no record of why the\npharmacy would not fill it, leaves the prescribing clinician guessing and the\npatient with nothing to be told.\n\nThe reason stays on the record. It is not copied into the audit event or any\nnotification, because a pharmacist explaining a refusal will naturally name\nthe medicine."
      properties:
        reason:
          type: string
          maxLength: 255
      required:
        - reason
      title: RejectDispenseOrderRequest
    RiderDeliveryResource:
      type: object
      properties:
        id:
          type: string
