                    type: string
                  title:
                    type: string
                    const: 'Too many attempts'
                  status:
                    type: integer
                    const: 429
                  code:
                    type: string
                    const: too_many_attempts
                  detail:
                    type: string
                    const: 'Wait a few minutes and try again.'
                  errors:
                    type: string
                required:
