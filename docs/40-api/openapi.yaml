        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/tenant:
    get:
      operationId: v1.tenant.show
      description: "Public: the patient portal needs this before anyone signs in, so it can\nrender the clinic's brand in the first HTML byte rather than flashing\nCarevelo's.\n\nThe tenant comes from ResolveTenant, never from the request — an unknown\nhost has already returned a neutral 404 by the time this runs."
      summary: "The current clinic's branding and contact details"
      tags:
        - Tenant
      responses:
        200:
          description: '`TenantResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TenantResource'
                required:
                  - data
    patch:
      operationId: v1.tenant.update
      description: "The subdomain cannot be changed here and the request says so explicitly\nrather than discarding it -- see UpdateTenantRequest."
      summary: 'Branding, contact details and compliance references'
      tags:
        - TenantAdmin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App.Http.Requests.Admin.Tenant.UpdateTenantRequest'
      responses:
        200:
          description: '`TenantAdminResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TenantAdminResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/tenant/logo:
    post:
      operationId: v1.tenant.logo
      description: "The upload is decoded and RE-ENCODED server-side. The declared MIME type\nis a claim by the uploader, and an image is a container: EXIF blocks,\ncolour profiles and trailing bytes all survive a naive copy, and a file\nthat is a valid image AND a valid script is a well-worn trick. Decoding\nto a pixel buffer and writing a fresh PNG discards everything that is not\nan image, including the metadata the branding document requires us to\nstrip."
      summary: "Replace the clinic's logo"
      tags:
        - TenantAdmin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadLogoRequest'
      responses:
        200:
          description: '`TenantAdminResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TenantAdminResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/tenant/onboarding-checklist:
    get:
      operationId: v1.tenant.checklist
      description: "The aggregator account is present and NOT required. §H1.6 is explicit:\na clinic without a merchant account completes onboarding, runs\nconsultations and takes payment at the counter. Marking it required would\nturn a commercial gap into a clinical blocker."
      summary: 'What remains before the clinic is live'
      tags:
        - TenantAdmin
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tenant_status: { type: string }
                      items: { type: array, prefixItems: [{ type: object, properties: { key: { type: string, const: branding }, label: { type: string, const: 'Logo and brand colours' }, is_complete: { type: string }, is_required: { type: boolean }, detail: { type: 'null' } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, const: services }, label: { type: string, const: "At least one bookable service, with the clinic's own price" }, is_complete: { type: boolean }, is_required: { type: boolean }, detail: { type: 'null' } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, const: clinicians }, label: { type: string, const: 'At least one registered clinician' }, is_complete: { type: boolean }, is_required: { type: boolean }, detail: { type: 'null' } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, description: "Platform-provided and versioned. The clinic may extend the\nwording but cannot remove the mandatory DPPA elements, so\nthis gate is satisfied the moment the tenant exists.", const: consent_templates }, label: { type: string, const: 'Patient consent text and privacy notice' }, is_complete: { type: boolean }, is_required: { type: boolean }, detail: { type: string } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, const: compliance_references }, label: { type: string, const: 'UMDPC facility reference and NDA pharmacy licence reference' }, is_complete: { type: string }, is_required: { type: boolean }, detail: { type: string } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, const: staff }, label: { type: string, const: 'Colleagues invited' }, is_complete: { type: string }, is_required: { type: boolean }, detail: { type: 'null' } }, required: [key, label, is_complete, is_required, detail] }, { type: object, properties: { key: { type: string, const: aggregator_account }, label: { type: string, const: "The clinic's own mobile-money account connected" }, is_complete: { type: boolean }, is_required: { type: boolean }, detail: { type: string } }, required: [key, label, is_complete, is_required, detail] }], minItems: 7, maxItems: 7, additionalItems: false }
                      is_ready_to_activate: { type: boolean }
                      note: { type: string }
                    required:
                      - tenant_status
                      - items
                      - is_ready_to_activate
                      - note
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/platform/totp:
    post:
      operationId: v1.platform.totp.store
      description: "THIS REVOKES WHAT THE ACCOUNT HAD, immediately and before anything is\nproved: the previous secret is overwritten, the account is marked\nunconfirmed, and every recovery code is destroyed. An operator who starts\nthis and abandons it cannot sign in until they finish it, and that is the\ncorrect trade rather than an accident. Re-enrolment is what somebody does\nwhen they believe their authenticator is compromised, and a rotation that\nleft the old secret working until the new one was confirmed would keep the\ncompromised factor live for exactly as long as the operator hesitated.\n\n201, because a new credential now exists."
      summary: 'Generate a secret and hand back the enrolment URI, once'
      tags:
        - TotpEnrolment
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string, description: "BOTH FORMS OF THE SAME SECRET, and both are needed. `uri` is what a camera scans. `secret` is what an operator\ntypes when the camera will not focus -- which, on a desk in a\nbadly-lit room with a laptop screen, is often. Omitting the\ntyped form does not reduce the exposure: the URI contains the\nsecret in full, in the query string, in plain view." }
                      uri: { type: string }
                      shown_once: { type: boolean, description: "Stated in the payload as well as in this docblock, because\nthe client renders it and the operator is the person who has\nto act on it." }
                    required:
                      - secret
                      - uri
                      - shown_once
                required:
                  - data
        403:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'This is not a platform account'
                  status:
                    type: integer
                    const: 403
                  code:
                    type: string
                    const: not_a_platform_account
                  detail:
                    type: string
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/platform/totp/confirm:
    post:
      operationId: v1.platform.totp.confirm
      description: "The code is checked with the SAME window and the SAME replay defence a\nsign-in challenge uses, because an enrolment confirmed by a code the\nchallenge path would refuse is an enrolment that appears to succeed and\nthen cannot be used."
      summary: 'Prove the authenticator works, activate it, and issue the recovery codes'
      tags:
        - TotpEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTotpEnrolmentRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recovery_codes: { type: [array, 'null'], description: "THE ONLY TIME THESE EXIST IN THE CLEAR. Ten codes, each\nspendable once, each stored as a SHA-256 digest the moment it\nwas minted. There is no \"show my codes\" endpoint and there\nmust not be one: an operator who did not write them down\nenrols again, which costs them two minutes, where a second\nendpoint costs everybody a standing way to read ten bypasses\nof the second factor out of a live system.", items: { type: string } }
                      shown_once: { type: boolean }
                      count: { type: integer, description: "The count is worth returning so a client can say \"ten codes,\n each usable once\" rather than counting an array and hoping.", const: 10 }
                    required:
                      - recovery_codes
                      - shown_once
                      - count
                required:
                  - data
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'This is not a platform account'
                  status:
                    type: integer
                    const: 403
                  code:
                    type: string
                    const: not_a_platform_account
                  detail:
                    type: string
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/working-hours:
    get:
      operationId: v1.working-hours.index
      tags:
        - WorkingHours
      responses:
        200:
          description: 'Array of `WorkingHourResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingHourResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    put:
      operationId: v1.working-hours.update
      description: "PUT on a collection means the body IS the timetable. A day the clinic no\nlonger opens is absent, and absence must remove the row: a merge-style\nupdate would leave last season's Saturday quietly published, and the\nfirst anyone would know is a patient standing at a locked door."
      summary: 'Replace the whole week'
      tags:
        - WorkingHours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkingHoursRequest'
      responses:
        200:
          description: 'Array of `WorkingHourResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingHourResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      description: "What an invitee may choose about their own account.\n\nA password, and an email address if they have one. NOT a role, NOT a phone\nnumber and NOT a clinic: those three are fixed by the invitation, and the\ncontroller reads them off the invitation row rather than from here.\n\n`role` is absent from the rules on purpose, so a body carrying one is\ndiscarded before the controller ever sees it. There is no code path from this\nrequest to a role assignment."
      properties:
        password:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
          description: "Optional everywhere in this product. Most Ugandan clinic staff\nhave a working phone and no reliably checked email address, and\nrequiring one here would stop them joining."
          maxLength: 255
        password_confirmation:
          type: string
      required:
        - password
        - password_confirmation
      title: AcceptInvitationRequest
    AddClinicalNoteAddendumRequest:
      type: object
      description: "Correcting a clinical note.\n\nThere is no field here for the note being corrected, because nothing about\nit changes. The body supplied is the body of a NEW note of type `addendum`\nthat points back at the original; the original stays exactly as it was\nwritten. A medical record that can be silently rewritten is not a medical\nrecord."
      properties:
        body:
          type: string
          maxLength: 20000
      required:
        - body
      title: AddClinicalNoteAddendumRequest
    AggregatorAccountResource:
      type: object
      properties:
        provider:
          type: string
        status:
          type: string
        environment:
          type: string
        last_verified_at:
          type:
            - string
            - 'null'
        accepts_online_payment:
          type: boolean
          description: "Whether the clinic can take an online collection right now. The\nconsole needs one boolean rather than a status vocabulary, and\nthis is the question it is actually asking."
        fallback:
          type: string
          description: "Said in plain words on every response, because the alternative is\na console that renders a missing payment account as a blocking\nerror and a clinic that stops booking patients over it."
        credentials_are_write_only:
          type: boolean
      required:
        - provider
        - status
        - environment
        - last_verified_at
        - accepts_online_payment
        - fallback
        - credentials_are_write_only
      title: AggregatorAccountResource
    App.Http.Requests.Admin.Tenant.UpdateTenantRequest:
      type: object
      description: "The clinic editing its own record during and after onboarding.\n\nTwo things happen here and both are security boundaries.\n\nCOLOURS ARE VALIDATED AGAINST A STRICT HEX PATTERN BEFORE STORAGE. Branding\nis applied as design tokens injected into CSS custom properties, so a stored\nvalue reaches a stylesheet; validating on render rather than on entry would\nleave one careless template between a tenant-supplied string and script\nexecution on a page displaying another patient's dosage instructions. The\npattern below admits `#RRGGBB` and nothing else -- not a colour keyword, not\na three-digit shorthand, not a `rgb()` function, and certainly not a\ndeclaration with a semicolon in it.\n\nTHE SUBDOMAIN IS IMMUTABLE. It is declared `prohibited` rather than merely\nomitted so the administrator gets a sentence explaining why instead of a\nsilent discard."
      properties:
        legal_name:
          type: string
          maxLength: 200
        trading_name:
          type:
            - string
            - 'null'
          maxLength: 120
        primary_colour:
          type:
            - string
            - 'null'
          pattern: '^#[0-9a-fA-F]{6}$'
        secondary_colour:
          type:
            - string
            - 'null'
          pattern: '^#[0-9a-fA-F]{6}$'
        contact_phone:
          type:
            - string
            - 'null'
        contact_email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        physical_address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        umdpc_facility_reference:
          type:
            - string
            - 'null'
          description: "The clinic's OWN attestation. Carevelo has no access to the UMDPC\nor NDA registers, performs no lookup against them, and the\nresource says so in the response."
          maxLength: 64
        nda_licence_reference:
          type:
            - string
            - 'null'
          maxLength: 64
        subdomain:
          type: string
          description: 'Not writable here, each for its own reason -- see messages().'
        slug:
          type: string
        custom_domain:
          type: string
        status:
          type: string
        logo_path:
          type: string
