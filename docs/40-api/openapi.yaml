              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: v1.patients.store
      description: "NO clinical data may attach in that state, which is why the status is set\nhere and cannot be supplied: a client able to post `active` could register\na patient who never consented to anything.\n\nThe response is deliberately indistinguishable whether or not the number\nwas already on file. \"This phone is already registered\" confirms that a\nspecific person is a patient of this specific clinic, and the fact of\nbeing someone's patient is itself special-category information under DPPA\n2019. So a repeat registration returns the record that already exists,\nwith the same status code and the same shape, and creates nothing."
      summary: 'Register a patient, in `pending_consent`'
      tags:
        - Patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePatientRequest'
      responses:
        201:
          description: '`PatientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PatientResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/patients/{patient}':
    get:
      operationId: v1.patients.show
