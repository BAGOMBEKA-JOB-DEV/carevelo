      tags:
        - PlatformTenant
      parameters:
        -
          name: tenant
          in: path
          required: true
          description: 'The tenant ID'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      format: { type: string, const: carevelo.tenant-export.v1 }
                      exported_at: { type: string }
                      tenant: { type: object, properties: { id: { type: string }, slug: { type: string }, subdomain: { type: string }, legal_name: { type: string }, trading_name: { type: [string, 'null'] }, contact_phone: { type: [string, 'null'] }, contact_email: { type: [string, 'null'] }, physical_address: { type: [string, 'null'] }, district: { type: [string, 'null'] }, umdpc_facility_reference: { type: [string, 'null'] }, nda_licence_reference: { type: [string, 'null'] }, timezone: { type: string }, currency: { type: string }, status: { $ref: '#/components/schemas/TenantStatus' } }, required: [id, slug, subdomain, legal_name, trading_name, contact_phone, contact_email, physical_address, district, umdpc_facility_reference, nda_licence_reference, timezone, currency, status] }
                      excluded: { type: object, description: "Named so the clinic knows what it did NOT receive, rather than\ndiscovering the gap later. Aggregator credentials are unreadable by every role including this\none: they are envelope-encrypted and decrypted only in memory at\nthe moment of an outbound call. The clinic holds them already —\nthey are the clinic's own credentials at the clinic's own\naggregator.", properties: { aggregator_credentials: { type: string } }, required: [aggregator_credentials] }
                      records: { type: string }
                      counts: { type: array, items: {  } }
                    required:
                      - format
                      - exported_at
                      - tenant
                      - excluded
                      - records
                      - counts
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/platform/health:
    get:
      operationId: v1.platform.health
      description: "Counts and one security assertion. No clinic is singled out, and nothing\nhere is about a person."
      summary: 'System health for a platform operator'
      tags:
