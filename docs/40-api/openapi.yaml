          $ref: '#/components/responses/AuthenticationException'
  /v1/sms-balance:
    get:
      operationId: v1.notifications.sms-balance
      description: "COUNTS OF MESSAGES, not a stored figure. SMS is a metered pass-through\nbilled by the gateway at cost plus a small margin; this platform holds\nnothing on the clinic's behalf and keeps no ledger to draw down, so the\nonly honest report is what it can count: the messages recorded for this\nclinic, and how many the per-tenant rate limit suppressed.\n\nThe suppressed count is the operationally important one. A clinic seeing\nit rise is a clinic whose reminders are silently not arriving."
      summary: 'SMS consumption for the current month'
      tags:
        - Notification
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
