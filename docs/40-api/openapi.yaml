      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordFulfilmentRequest'
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/collect':
    post:
      operationId: v1.dispensing.collect
      description: "Terminal, and deliberately narrower than it looks: an order set for\nDELIVERY cannot be collected here. Marking a delivery collected would close\nit while a rider still holds the package, and the tracking the patient is\nwatching would go quiet with their medicines still in transit.\n\nAccepts an order that is dispensed but was never explicitly readied --\nready_for_pickup is a shelf state, and a pharmacist who dispensed and handed\nover in one motion did not skip a step, they did two at once. The walk\nthrough ready_for_pickup is still made rather than jumped, so the state\nmachine records both."
      summary: 'The patient collected it at the pharmacy'
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /health/live:
    get:
      operationId: health.live
      description: "It touches nothing. A liveness probe that queried the database would\nrestart healthy application containers during a database incident, which\nturns a recoverable outage into a thundering herd."
      summary: 'Liveness: this process is running'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: alive
                required:
                  - status
  /health/ready:
    get:
      operationId: health.ready
      description: "Database, Redis and storage. A 503 takes this instance out of the load\nbalancer rather than serving errors to patients."
      summary: 'Readiness: the dependencies needed to serve a request are reachable'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: string
  /health/isolation:
    get:
      operationId: health.isolation
      description: "PostgreSQL exempts a table's OWNER from row-level security. If the\napplication role owns a table -- or merely holds the right to create one,\nwhich is the same thing one careless migration later -- every isolation\npolicy becomes inert. The system then works perfectly and protects\nnothing: there is no error, no warning, and no behavioural test anywhere\nthat notices. That is why it is asserted here rather than assumed.\n\nA cross-tenant leak is a notifiable breach affecting two data controllers\nat once, so this failing is not a degraded service. It is an incident."
      summary: 'The isolation check. A SECURITY check, not an uptime check'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: string
  '/v1/invitations/{token}/accept':
    post:
      operationId: v1.invitations.accept
      tags:
        - Invitation
      parameters:
        -
          name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        409:
          description: "Distinguished from expiry, and safe to distinguish: the caller\nalready holds the token, so this discloses nothing they did not\ngive us. It is also the difference between \"ask for a new link\"\nand \"you already have an account\"."
          content:
            application/problem+json:
              schema:
                anyOf:
                  -
                    type: object
                    properties:
                      type: { type: string }
                      title: { type: string, const: 'That number already has an account at this clinic' }
                      status: { type: integer, const: 409 }
                      code: { type: string, const: account_exists }
                      detail: { type: string, const: 'Sign in instead.' }
                      errors: { type: string }
                    required:
                      - type
                      - title
                      - status
                      - code
                      - detail
                      - errors
                  -
                    type: object
                    properties:
                      type: { type: string }
                      title: { type: string, const: 'This invitation has already been used' }
                      status: { type: integer, const: 409 }
                      code: { type: string, const: invitation_already_accepted }
                      detail: { type: string, const: 'Sign in with your phone number, or ask the clinic for a new invitation.' }
                      errors: { type: string }
                    required:
                      - type
                      - title
                      - status
                      - code
                      - detail
                      - errors
        410:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'This invitation has expired'
                  status:
                    type: integer
                    const: 410
                  code:
                    type: string
                    const: invitation_expired
                  detail:
                    type: string
                    const: 'Ask the clinic to send you a new one.'
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/appointments/{appointment}/join-token':
    post:
      operationId: v1.appointments.join-token
      summary: 'Issue this participant a token for this appointment'
