        - description
        - duration_minutes
        - price
        - modes
        - eligible_roles
        - is_active
        - created_at
        - updated_at
      title: ServiceResource
    SignInRequest:
      type: object
      description: "Password sign-in, by email address or by phone number.\n\nBOTH, because the two audiences are genuinely different. A clinic administrator sits at\na desk with an email address and expects to type it; a clinician between rooms has their\nphone in their hand and their number is the identifier the clinic already holds. The\nbusiness plan is blunt about the second case: most Ugandan clinic staff have a working\nphone and no reliably checked email address, so neither identifier can be the only way in.\n\nExactly one is required. Sending both is a confused client rather than a convenience,\nand picking one silently would mean two requests that look identical signing in as\ndifferent people.\n\nPatients may also use a code with no password at all, which is a different endpoint."
      properties:
        email:
          type:
            - string
            - 'null'
          format: email
          description: "required_without rather than required: either identifies the account, and\nthe pair is mutually exclusive below."
          maxLength: 255
        phone:
          type:
            - string
            - 'null'
        password:
          type: string
          description: "No length or composition rule on the way IN. A minimum here tells an\nattacker the shape of what to guess, and rejects a correct password set\nbefore the rule existed."
      required:
        - password
      title: SignInRequest
    StaffResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        roles:
          type: array
          description: "Roles, not permissions. The matrix is the contract, and a client\nthat reasons about individual permissions will drift from it."
          items:
            type: string
        is_active:
          type: boolean
        phone_verified_at:
          type:
            - string
            - 'null'
          description: "The signal an administrator actually needs while onboarding: an\ninvited colleague who never verified cannot sign in yet."
      required:
        - id
        - name
        - phone
        - email
        - roles
        - is_active
        - phone_verified_at
      title: StaffResource
    StartConsultationRequest:
      type: object
      description: "Starting a consultation.\n\nThe appointment is looked up by id and nothing else. There is no tenant field\nhere or anywhere else in a request body -- tenancy comes from the host or the\nsession, and the `exists` rule runs under row-level security, so an\nappointment belonging to another clinic simply is not there to be found."
      properties:
        appointment_id:
          type: string
        mode_used:
          description: "Optional, and only ever the mode ACTUALLY in use. A clinician who\nknows the patient's connection will not carry video says so at\nthe start rather than after a failed attempt; the booked mode is\nleft untouched as the record of what was agreed."
          $ref: '#/components/schemas/ConsultationMode'
      required:
        - appointment_id
      title: StartConsultationRequest
    StoreAppointmentRequest:
      type: object
      description: 'Books a consultation: patient, clinician, service, slot, mode, fee expectation.'
      properties:
        patient_id:
          type: string
          description: "The exists rules run through the same connection as everything\nelse, so row-level security has already scoped them to this\ntenant: an id belonging to another clinic simply does not exist\nas far as this request is concerned. That is deliberate -- a\n\"belongs to another tenant\" error would confirm the record\nexists somewhere, which is exactly what we do not disclose."
        clinician_id:
          type: string
        service_id:
          type: string
        scheduled_start_at:
          type: string
          format: date-time
        scheduled_end_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Optional: when absent the slot length comes from the service, which\nis where the clinic already maintains it."
        mode_booked:
          description: "Voice and chat are FIRST-CLASS modes, not degraded fallbacks. A\npatient on a poor connection must be able to choose voice\ndeliberately rather than fight a failing video call."
          $ref: '#/components/schemas/ConsultationMode'
        payment_expectation:
          type: string
          enum:
            - prepaid
            - pay_at_clinic
      required:
        - patient_id
        - clinician_id
        - service_id
        - scheduled_start_at
        - mode_booked
        - payment_expectation
      title: StoreAppointmentRequest
    StoreBreakGlassGrantRequest:
      type: object
      description: "Requesting clinical access to a clinic's records.\n\nFour fields, and none of them is optional in substance:\n\n  tenant_id  — whose records\n  reason     — why, in enough words to be reviewable\n  scope      — which records, from a closed list\n  expires_at — until when, and no longer than a day\n\nA minimum length on the reason is a blunt instrument and is here on purpose.\n\"debug\" satisfies a `required` rule and tells a later reviewer nothing, and\nthese grants are reviewed periodically by someone who was not in the room.\n\nThis is also the one place tenant_id legitimately arrives in a request body.\nEverywhere else in the API it comes from the host or the session — but a\ncross-tenant control surface has no host to read it from, and the operator is\nnaming the clinic they are asking about. Authorisation does not depend on it:\nthe policy grants the ABILITY to request, and the grant that results is\nnotified to the named clinic, which is what makes a wrong or malicious value\nvisible rather than useful."
      properties:
        tenant_id:
          type: string
        reason:
          type: string
          minLength: 20
          maxLength: 1000
        scope:
          type: string
          enum:
            - patient_record
            - consultation
            - clinical_note
            - prescription
            - dispensing
            - delivery
            - payment
            - audit_trail
        expires_at:
          type: string
          format: date-time
          description: "The time box, both ends of it. A grant that starts in the past\nwould be retrospective authorisation, and one that outruns the\nmaximum is standing access wearing an exception's costume."
      required:
        - tenant_id
        - reason
        - scope
        - expires_at
      title: StoreBreakGlassGrantRequest
    StoreClinicalNoteRequest:
      type: object
      description: "Writing a clinical note.\n\nDeliberately permissive about completeness. Drafts persist continuously as\nthey are typed, so this endpoint has to accept a half-finished sentence: a\nlost connection must never lose clinical text, and validation that demanded a\ncomplete note would guarantee it did. Over-structuring the note is also the\nfastest way to make a clinician abandon the system.\n\nWhat it will not accept is a note with no section, because an unclassified\nnote is unreadable to the next clinician."
      properties:
        body:
          type: string
          maxLength: 20000
        note_type:
          type: string
          enum:
            - subjective
            - objective
            - assessment
            - plan
      required:
        - body
      title: StoreClinicalNoteRequest
    StoreConsentRequest:
      type: object
      description: "One consent decision, for one consent type.\n\nThe shape of this body is the compliance control. Three properties matter:\n\n  1. `consent_type` is singular. There is no array, so no client can bundle\n     three consents behind one tick -- DPPA 2019 requires consent to be\n     specific, and a bundle is not specific.\n  2. `affirmed` is REQUIRED and boolean. There is no default, because a\n     default is the absence of an affirmative action, and the absence of an\n     affirmative action is not consent. Omitting it is a 422, never a grant.\n  3. `policy_version` is required and must match what the server is currently\n     serving. A client showing stale wording collected consent to text we\n     cannot reconstruct, which fails the \"demonstrable\" test outright."
      properties:
        consent_type:
          type: string
          enum:
            - data_processing
            - telemedicine
            - delivery_disclosure
        affirmed:
          type: boolean
        policy_version:
          type: string
          maxLength: 32
        granted_by:
          type: string
          description: "Recorded on the ConsentRecord so the author of the decision\nsurvives in the evidence, not merely the fact of it."
          enum:
            - patient
            - guardian
        guardian_name:
          type: string
          maxLength: 200
        guardian_relationship:
          type: string
          maxLength: 60
      required:
        - consent_type
        - affirmed
        - policy_version
      title: StoreConsentRequest
    StoreDeliveryRequest:
      type: object
      description: "Dispatching a dispensed order.\n\nThe body carries only what a courier needs to find a door: a name, a number,\nan address. There is deliberately no field here for a medicine, an item list\nor a note -- a delivery holds no clinical data, so there is nothing for a\ncareless client to send."
      properties:
        dispense_order_id:
          type: string
        recipient_name:
          type: string
          maxLength: 120
        recipient_phone:
          type: string
        address_text:
          type: string
          description: "A Ugandan delivery address is a sentence and a landmark, not a\nstreet number. \"Opposite Shell Bugolobi\" is how riders actually\nnavigate, so the landmark is a first-class field rather than an\nafterthought appended to the address line."
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 60
        landmark:
          type:
            - string
            - 'null'
          maxLength: 255
      required:
        - dispense_order_id
        - recipient_name
        - recipient_phone
        - address_text
      title: StoreDeliveryRequest
    StorePatientRequest:
      type: object
      description: "Registration: the minimum a clinic needs to contact a person about care.\n\nNote what is NOT required, and never will be: `national_id_number`. Requiring\na NIN excludes patients, and exclusion is a worse outcome than unverified\nidentity ([Identifiers](../20-domain/identifiers-and-numbering.md)).\n\nNote also what is absent: `status`. A patient is created in `pending_consent`\nand moves on only through a consent decision. A client that could post a\nstatus could register an already-consenting patient."
      properties:
        given_name:
          type: string
          maxLength: 100
        family_name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: "Mandatory: the phone is how appointment details, payment prompts\nand prescription-ready notifications reach the patient. Deliberately NOT `unique`. A \"this number is already registered\"\nmessage confirms that a specific person is a patient of this\nclinic, which is itself special-category disclosure under DPPA\n2019. The controller de-duplicates silently instead."
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        date_of_birth:
          type:
            - string
            - 'null'
          format: date-time
        sex:
          type:
            - string
            - 'null'
          enum:
            - female
            - male
            - other
            - prefer_not_to_say
            - null
        national_id_number:
          type:
            - string
            - 'null'
          maxLength: 32
        address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        guardian_name:
          type:
            - string
            - 'null'
          maxLength: 200
        guardian_phone:
          type:
            - string
            - 'null'
        guardian_relationship:
          type:
            - string
            - 'null'
          maxLength: 60
      required:
        - given_name
        - family_name
        - phone
      title: StorePatientRequest
    StorePrescriptionRequest:
      type: object
      description: "The prescribing form.\n\nShape only. The two hard preconditions on prescribing — the clinician's\nright to prescribe, and the consultation outcome — are enforced by\nPrescription::issue(), never here: they are domain rules that must hold for\nevery caller, not validation the API layer happens to apply.\n\nThere is deliberately no clinician_id field. A prescription is the act of\nthe authenticated clinician; accepting the identity from the body would let\none clinician sign in another's name."
      properties:
        consultation_id:
          type: string
        items:
          type: array
          description: 'A prescription with no items is not a clinical document.'
          items:
            type: object
            properties:
              medicine_name:
                type: string
                maxLength: 255
              form:
                type:
                  - string
                  - 'null'
                maxLength: 255
              strength:
                type:
                  - string
                  - 'null'
                maxLength: 255
              quantity:
                type: integer
                minimum: 1
              unit:
                type:
                  - string
                  - 'null'
                maxLength: 255
              directions:
                type: string
                maxLength: 2000
              is_controlled:
                type: boolean
                description: "Controlled items are flagged by the clinician. Carevelo does not\nclassify medicines — doing so would be a clinical judgement it\nhas no standing to make."
            required:
              - medicine_name
              - quantity
              - directions
          minItems: 1
      required:
        - consultation_id
        - items
      title: StorePrescriptionRequest
    StoreServiceRequest:
      type: object
      description: "Adds a service to the clinic's own catalogue."
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        price_minor:
          type: integer
          description: 'Integer minor units. Never a float.'
          minimum: 0
          maximum: 100000000000
        currency:
          anyOf:
            -
              $ref: '#/components/schemas/Currency'
            -
              type: 'null'
        modes:
          type:
            - array
            - 'null'
          description: "Which modes the clinic considers safe for this service is a\nclinical judgement belonging to the clinic. We record it."
          items:
            $ref: '#/components/schemas/ConsultationMode'
          maxItems: 4
        eligible_roles:
          type:
            - array
            - 'null'
          items:
            type: string
            enum:
              - clinic_admin
              - clinician
              - pharmacist
              - dispatcher
              - front_desk
              - rider
              - patient
          maxItems: 7
        is_active:
          type:
            - boolean
            - 'null'
      required:
        - name
        - duration_minutes
        - price_minor
      title: StoreServiceRequest
    StoreSubstitutionRequest:
      type: object
      description: "A pharmacist PROPOSING a substitute.\n\nProposing only. There is deliberately no `status` field and no\n`approve_immediately` flag: a substitution takes effect on a clinician's\napproval or not at all, and the shape of this request is one of the places\nthat is made structurally true rather than merely checked.\n\nThe reason is mandatory. It is the entire basis on which a clinician who is\nnot standing in the pharmacy decides, and \"out of stock\" is a very different\nclinical question from \"the strength we hold is different\"."
      properties:
        prescription_item_id:
          type: string
        proposed_medicine_name:
          type: string
          maxLength: 255
        reason:
          type: string
          maxLength: 2000
      required:
        - prescription_item_id
        - proposed_medicine_name
        - reason
      title: StoreSubstitutionRequest
    StoreTenantRequest:
      type: object
      description: "Provisioning a clinic.\n\nNote what is absent: `status`. A tenant is created in `provisioning` and\nmoves on only through TenantStatus, so a client cannot post an already-active\nclinic into existence.\n\nNote also what the subdomain is checked against. It appears in patient-facing\nURLs, in the aggregator's webhook configuration and on printed materials, and\nit is immutable afterwards — so a clinic that claims `api` or `admin` does not\nmerely have an awkward name, it shadows a platform host."
      properties:
        legal_name:
          type: string
          maxLength: 255
        trading_name:
          type:
            - string
            - 'null'
          maxLength: 255
        subdomain:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 63
        contact_phone:
          type:
            - string
            - 'null'
        contact_email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        physical_address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        umdpc_facility_reference:
          type:
            - string
            - 'null'
          description: "The clinic's OWN attestation. Carevelo has no access to the UMDPC\nor NDA registers and never presents these as verified."
          maxLength: 100
        nda_licence_reference:
          type:
            - string
            - 'null'
          maxLength: 100
        trial_ends_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - legal_name
        - subdomain
      title: StoreTenantRequest
    SubstitutionResource:
      type: object
      properties:
        id:
          type: string
        dispense_order_id:
          type: string
        prescription_item_id:
          type: string
        proposed_medicine_name:
          type: string
        reason:
          type: string
        status:
          type: string
        proposed_by:
          type: string
        proposed_at:
          type:
            - string
            - 'null'
        decided_by:
          type:
            - string
            - 'null'
        decided_at:
          type:
            - string
            - 'null'
      required:
