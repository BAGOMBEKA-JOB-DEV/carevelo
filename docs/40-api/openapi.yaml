      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreServiceRequest'
      responses:
        201:
          description: '`ServiceResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/services/{service}':
    delete:
      operationId: v1.services.destroy
      description: "Appointments, and through them consultations and prescriptions, carry a\nservice_id. Deleting the row would orphan every one of them: a clinic\nlooking at last year's bookings would see a reference resolving to\nnothing, and a foreign key would either refuse the delete or cascade the\nhistory away. Neither is acceptable for a record a clinic may have to\nproduce years later.\n\nThe verb stays DELETE because that is what a client means, and because\nthe observable effect -- it leaves the catalogue -- is the same."
      summary: 'DELETE is a DEACTIVATION. The row is never removed'
      tags:
        - Service
      parameters:
        -
          name: service
          in: path
          required: true
          description: 'The service ID'
          schema:
            type: string
      responses:
        200:
          description: '`ServiceResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    patch:
      operationId: v1.services.update
      tags:
        - Service
      parameters:
        -
          name: service
          in: path
          required: true
          description: 'The service ID'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        200:
          description: '`ServiceResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/tenant/users:
    get:
      operationId: v1.staff.index
      tags:
        - Staff
      responses:
        200:
          description: 'Paginated set of `StaffResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/tenant/users/invite:
    post:
      operationId: v1.staff.invite
      description: "The invitation row holds a HASH of the token, never the token. It is a\nbearer credential for as long as it lives -- whoever holds it can create\nan account inside this clinic, in the role written here -- so a leaked\ndatabase backup must not be a set of usable invitations. The plaintext\nleaves this method exactly once, in the SMS."
      summary: 'Invite a colleague by phone'
      tags:
        - Staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      role: { type: string }
                      expires_at: { type: string }
                      note: { type: string, description: "Deliberately absent: the token. It exists in the SMS and\nnowhere else -- not this response, not the audit event, not a\nlog line." }
                    required:
                      - id
                      - role
                      - expires_at
                      - note
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/tenant/users/{user}':
    patch:
      operationId: v1.staff.update
      description: "THE LAST ACTIVE ADMINISTRATOR CANNOT LOSE ADMINISTRATIVE ACCESS. Locking a\nclinic out of its own tenant is a support incident we would have to fix\nwith database access, and it is worse than that: the clinic is the data\ncontroller for every record inside, and a controller that cannot reach its\nown data cannot answer a subject-access request or a regulator. So the\nrefusal is here rather than in the console, where a second client would\nhave to remember it."
      summary: "Correct a staff member's details, role or access"
      tags:
        - Staff
      parameters:
        -
          name: user
          in: path
          required: true
          description: 'The user ID'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        200:
          description: '`StaffResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffResource'
                required:
                  - data
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/substitutions':
    post:
      operationId: v1.substitutions.store
      description: "Only that item. The order moves to awaiting_substitution, from which the\nremaining items can still be priced — one out-of-stock line must not\nstall the whole order, or pharmacists work around the system instead of\nwith it."
      summary: 'A pharmacist proposes a substitute, and the affected item blocks'
      tags:
        - Substitution
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubstitutionRequest'
      responses:
        201:
          description: '`SubstitutionResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubstitutionResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/substitutions/{substitution}/approve':
    post:
      operationId: v1.substitutions.approve
      summary: 'Approve. Clinician only — enforced by SubstitutionPolicy::decide'
      tags:
        - Substitution
      parameters:
        -
          name: substitution
          in: path
          required: true
          description: 'The substitution ID'
          schema:
            type: string
      responses:
        200:
          description: '`SubstitutionResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubstitutionResource'
                required:
                  - data
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/substitutions/{substitution}/reject':
    post:
      operationId: v1.substitutions.reject
      summary: "Reject. The item is then filled as unfulfilled with a reason, and the\npatient is offered a partial fill — it is not silently dropped"
      tags:
        - Substitution
      parameters:
        -
          name: substitution
          in: path
          required: true
          description: 'The substitution ID'
          schema:
            type: string
      responses:
