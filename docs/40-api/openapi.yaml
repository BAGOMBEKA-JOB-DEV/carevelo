      responses:
        200:
          description: "BUILT FROM THE LISTING'S PROJECTION PLUS EXACTLY ONE FIELD, and the\none field is the whole difference between the two screens.\n\nThe payload used to be assembled by hand here, which meant the rule\n\"what may a patient read off a delivery\" had two implementations — and\nthe second one, the listing, did not exist yet. Now there is one, in\n`PatientDeliveryResource`, and this endpoint is that shape with\n`failure_reason` added.\n\nWHY THE REASON IS ADDED HERE AND NOT THERE. A list is read at a glance\nand often not by the person it belongs to; \"refused\" against a row is a\nstatement about a household, legible to anyone holding the phone. One\ndelivery, opened deliberately, is a different act — and it is the\nscreen that can put the clinic's telephone number beside the reason so\nit leads somewhere. See the resource's own field-by-field argument."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      reference: { type: string }
                      status: { type: string }
                      assigned_at: { type: [string, 'null'] }
                      delivered_at: { type: [string, 'null'] }
                      milestones: { type: array, description: "`array_values()` rather than the collection's own `->values()`, which is\nalready called below and is correct at runtime. PHPStan types\n`Collection::all()` as `array<int, T>` and cannot see that `values()` has\njust resequenced the keys, so the declared `list<>` return would not hold.\nThe native function it does understand, and reaching for it is cheaper than\na suppression -- the shape matters, because a non-list here serialises as a\nJSON object keyed by index rather than an array, and a patient's delivery\nthread would arrive at the portal as `{\"0\":{...}}`.", items: {  } }
                      failure_reason: { type: [string, 'null'] }
                    required:
                      - id
                      - reference
                      - status
                      - assigned_at
                      - delivered_at
                      - milestones
                      - failure_reason
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/dispense-orders:
    get:
      operationId: v1.dispense-orders.index
      description: "Medicine names are deliberately absent from BOTH: the prescription\nrelation is not loaded, so the listing is references, states and money. A\npharmacist scanning for work does not need the contents, and this is the\nmost-displayed screen in the pharmacy.\n\n==================================================================\nWHY THE PATIENT BRANCH EXISTS AT ALL\n==================================================================\n\n`DispenseOrderPolicy::viewOwn()` has admitted a patient since it was\nwritten and nothing called it, so a patient could open a dispense order\nonly if they ALREADY held its identifier — and nothing they were allowed to\ncall ever handed them one. Paying for a dispensed order and choosing\ncollection or delivery therefore had no entry point in the portal at all:\nboth opened from a link the clinic sent, or not at all. This is that entry\npoint.\n\n==================================================================\nTHE ONE FIELD THAT CHANGES BETWEEN THE TWO AUDIENCES\n==================================================================\n\n`substitutions` IS LOADED FOR STAFF ONLY, and the reason is that\n`SubstitutionResource` publishes `proposed_medicine_name` — correctly, for\na clinician who cannot decide on a substitution without knowing what is\nbeing proposed. Loading it for a patient would put a medicine name in a\nLIST, on the surface this controller's own docblock says is kept free of\nthem, read on shared handsets and over shoulders. It is not withheld from\nthe patient as a fact: the order's own screen, reached by opening one row\ndeliberately, is behind `view` and carries the whole prescription.\n\nNothing else differs, so there is one resource class rather than two —\n`DispenseOrderResource` already gates the relation behind `whenLoaded()`,\nso the field is ABSENT from a patient's payload rather than blanked, which\nis the distinction the rider resource argues at length.\n\nCURSOR FOR THE PATIENT, OFFSET STILL FOR THE QUEUE. The house rule is\ncursor pagination and the new listing gets it from its first day. The queue\nkeeps `paginate()` because the clinic console reads `meta.total` to warn a\npharmacist that a lane holds more orders than one page can carry, and\n`cursorPaginate()` produces no total; moving it is a change to those\nscreens as well as to this line, and this change does not own them. See\n`apps/clinic-console/src/domains/dispensing/api/queue.ts`, which already\nsays it is sending an offset under protest."
      summary: "Two listings behind one route: the pharmacy queue, and the patient's own\norders"
      tags:
        - DispenseOrder
      parameters:
        -
          name: status
          in: query
          schema:
            $ref: '#/components/schemas/DispenseOrderStatus'
        -
          name: patient_id
          in: query
          schema:
            type: string
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: cursor
          in: query
          description: "`cursor` and `page` are both accepted because this route serves two\nlistings. A patient's own orders page by CURSOR, which is the house\nrule; the pharmacy queue still pages by offset because the console\nreads `meta.total` off it to warn that a lane has overflowed, and a\ncursor paginator has no total to read. Whichever paginator runs\nignores the other's parameter, so sending both is harmless rather\nthan ambiguous — and `RejectsUnknownFields` means a client cannot\nsend `cursor` at all unless it is declared here."
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf: [{ $ref: '#/components/schemas/DispenseOrderResource' }, { type: object, required: [substitutions] }]
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispense_order}':
    get:
      operationId: v1.dispense-orders.show
      description: "This is the one place a medicine name is meant to be read, and it is\nbehind the policy. The read is audited: \"who looked at my records?\" can\nonly be answered by having recorded every look."
      summary: 'The order in full, including what was prescribed'
      tags:
        - DispenseOrder
