  /v1/tenant/users:
    get:
      operationId: v1.staff.index
      tags:
        - Staff
      responses:
        200:
          description: 'Paginated set of `StaffResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/tenant/users/invite:
    post:
      operationId: v1.staff.invite
      description: "The invitation row holds a HASH of the token, never the token. It is a\nbearer credential for as long as it lives -- whoever holds it can create\nan account inside this clinic, in the role written here -- so a leaked\ndatabase backup must not be a set of usable invitations. The plaintext\nleaves this method exactly once, in the SMS."
      summary: 'Invite a colleague by phone'
      tags:
        - Staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      role: { type: string }
                      expires_at: { type: string }
                      note: { type: string, description: "Deliberately absent: the token. It exists in the SMS and\nnowhere else -- not this response, not the audit event, not a\nlog line." }
                    required:
                      - id
                      - role
                      - expires_at
                      - note
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/tenant/users/{user}':
    patch:
      operationId: v1.staff.update
      description: "THE LAST ACTIVE ADMINISTRATOR CANNOT LOSE ADMINISTRATIVE ACCESS. Locking a\nclinic out of its own tenant is a support incident we would have to fix\nwith database access, and it is worse than that: the clinic is the data\ncontroller for every record inside, and a controller that cannot reach its\nown data cannot answer a subject-access request or a regulator. So the\nrefusal is here rather than in the console, where a second client would\nhave to remember it."
      summary: "Correct a staff member's details, role or access"
      tags:
        - Staff
      parameters:
        -
          name: user
          in: path
          required: true
          description: 'The user ID'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
