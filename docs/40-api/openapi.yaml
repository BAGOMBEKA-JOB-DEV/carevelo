                - null
            secondary_colour:
              type:
                - string
                - 'null'
            secondary_foreground:
              type:
                - string
                - 'null'
              enum:
                - '#FFFFFF'
                - '#000000'
                - null
            surface:
              type:
                - string
                - 'null'
            logo_url:
              type: 'null'
            contrast_advisories:
