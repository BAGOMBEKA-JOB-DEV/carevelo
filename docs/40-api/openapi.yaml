  /v1/platform/auth/sign-in:
    post:
      operationId: v1.platform.auth.sign-in
      description: "A 200 from here means \"the password was right and a code is now\n     * required\", and it is the only thing an operator can learn from it. Note\nwhat it does NOT return: nothing about the account, no name, no roles, no\nidentifier. RequireSecondFactor::PERMITTED_ROUTES makes the same argument\nabout `/v1/me` -- handing an account's details to whoever holds the\npassword alone is a disclosure, and the client needs exactly one fact to\nrender the next screen: that there is a next screen."
      summary: 'Step one: prove the password. Returns no session'
      tags:
        - PlatformAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSignInRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      second_factor: { type: string, description: "Named rather than boolean, so the client renders the right\nsecond step. There is exactly one value it can take today and\nthere must never be an `sms` one -- see Totp::uri().", const: totp }
                      expires_in: { type: integer, const: 300 }
                    required:
                      - second_factor
                      - expires_in
                required:
                  - data
        403:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'This account has no second factor'
                  status:
                    type: integer
                    const: 403
                  code:
                    type: string
                    const: second_factor_not_enrolled
                  detail:
                    type: string
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        429:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'Too many attempts'
                  status:
                    type: integer
                    const: 429
                  code:
                    type: string
                    const: too_many_attempts
                  detail:
                    type: string
                    const: 'Wait a few minutes and try again.'
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/platform/auth/challenge:
    post:
      operationId: v1.platform.auth.challenge
      summary: 'Step two: the code. This is the request that actually signs anybody in'
      tags:
        - PlatformAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorChallengeRequest'
      responses:
        200:
          description: "The same resource /v1/platform/me returns. A client that has just\nsigned in wants exactly what it would ask that endpoint for.\n\n\n\n`MeResource`"
