  '/v1/payment-intents/{paymentIntent}/attest-cash':
    post:
      operationId: v1.payments.attest-cash
      description: "No aggregator is involved and no money passes through Carevelo — the\npatient handed notes to a person standing behind a counter. All this\nrecords is that a member of the clinic's staff says so, which is why the\nattestation is attributed and audited: it is the clinic's own internal\ncontrol, and the audit trail is the only thing that makes it one.\n\nONLY cash_at_clinic. An aggregator-backed collection can never be marked\nsucceeded by hand — that would let a staff member assert a payment the\naggregator never confirmed, turning the clinic's own books into fiction\nand defeating reconciliation, whose whole purpose is to resolve\nindependently of what anyone claims."
      summary: 'A named staff member attests that cash was received at the clinic'
      tags:
        - PaymentIntent
      parameters:
        -
          name: paymentIntent
          in: path
          required: true
          description: 'The payment intent ID'
          schema:
            type: string
      responses:
        200:
          description: '`PaymentIntentResource`'
          content:
            application/json:
