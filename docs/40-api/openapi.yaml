  /v1/notification-templates:
    get:
      operationId: v1.notifications.templates
      description: "Returned in full, patterns included, because the clinic is the data\ncontroller and is entitled to see exactly what is sent under its own\nsender ID. It is also the review surface for the content rule -- the\ncatalogue is short enough to read, which is the only reason the rule can\nbe checked at all.\n\nThe catalogue is READ-ONLY. A clinic cannot edit a pattern or add one:\nevery template is asserted against the prohibited-content list, and an\neditable template is an unreviewed one."
      summary: 'The catalogue: every message this platform is capable of sending'
      tags:
        - Notification
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {  }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      note: { type: string }
                    required:
                      - total
                      - note
                required:
                  - data
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/sms-balance:
    get:
      operationId: v1.notifications.sms-balance
      description: "COUNTS OF MESSAGES, not a stored figure. SMS is a metered pass-through\nbilled by the gateway at cost plus a small margin; this platform holds\nnothing on the clinic's behalf and keeps no ledger to draw down, so the\nonly honest report is what it can count: the messages recorded for this\nclinic, and how many the per-tenant rate limit suppressed.\n\nThe suppressed count is the operationally important one. A clinic seeing\nit rise is a clinic whose reminders are silently not arriving."
      summary: 'SMS consumption for the current month'
      tags:
        - Notification
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period_start: { type: string }
                      sms: { type: string }
                      rate_limit: { type: object, properties: { per_minute: { type: integer, const: 120 }, suppressed_this_period: { type: integer, minimum: 0 } }, required: [per_minute, suppressed_this_period] }
                    required:
                      - period_start
                      - sms
                      - rate_limit
                  meta:
                    type: object
                    properties:
                      note: { type: string }
                    required:
                      - note
                required:
                  - data
                  - meta
