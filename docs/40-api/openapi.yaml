        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/dispense-orders/{dispenseOrder}/price':
    post:
      operationId: v1.dispensing.price
      description: "Four refusals live here, and each one is the reason this endpoint is not\na simple write:\n\n  1. an item that is not on the prescription cannot be priced;\n  2. every prescribed item must be accounted for — filled, or explicitly\n     unfulfilled with a reason. Silence is not an option, because a\n     silently dropped line is a medicine the patient never learns they\n     did not get;\n  3. an item with a PENDING substitution blocks — only that item, never\n     the rest of the order;\n  4. a substitute may only be filled against an APPROVED substitution.\n     This is the control that makes clinician approval real rather than\n     advisory."
      summary: "Price the order at the clinic's own prices, recording what will be filled"
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceDispenseOrderRequest'
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items, substitutions] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/dispense':
    post:
      operationId: v1.dispensing.dispense
      description: "The pharmacist is the authenticated user, never a body field: accepting\nan identity from the request would let one member of staff dispense in\nanother's name, and attribution is the whole point of the record.\n\nDispenseOrder::dispense() refuses while any substitution is still\npending, so an unapproved substitute cannot leave the pharmacy."
      summary: 'Hand the medicine over, against a NAMED pharmacist of this clinic'
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/dispense-orders/{dispenseOrder}/reject':
    post:
      operationId: v1.dispensing.reject
      description: "The reason is recorded so the prescribing clinician is not left guessing,\nand stays out of the audit event: a pharmacist explaining a refusal will\nname the medicine, and an audit event records that something happened,\nnever what it said."
      summary: 'The pharmacy declines to fill the order'
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDispenseOrderRequest'
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/fulfilment':
    post:
      operationId: v1.dispensing.fulfilment
      description: "Two refusals live here, and both exist so that the answer given at the\ncounter is the same one dispatch will give later:\n\n  1. an order holding a controlled item can never be delivered (NDPA Act\n     Cap 206). There is no override, and refusing at this point means the\n     patient is told while they are still standing there rather than after\n     they have gone home to wait;\n  2. delivery requires the patient's delivery_disclosure consent to already\n     be granted. This endpoint does not WRITE that consent -- capturing it\n     needs the exact policy wording the patient read, and ConsentController\n     owns that text and the hash taken over it. A second writer here would\n     pin a hash to text it had reproduced by hand, which is precisely the\n     failure the hash exists to catch.\n\nChoosing pickup on an already-dispensed order also readies it for\ncollection: the medicine is on the shelf with the patient's name on it,\nwhich is what ready_for_pickup means. Delivery does not transition here,\nbecause leaving the pharmacy needs a Delivery record and a rider -- that is\nDeliveryController's job."
      summary: 'Record whether the patient is collecting or having it delivered'
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordFulfilmentRequest'
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/dispense-orders/{dispenseOrder}/collect':
    post:
      operationId: v1.dispensing.collect
      description: "Terminal, and deliberately narrower than it looks: an order set for\nDELIVERY cannot be collected here. Marking a delivery collected would close\nit while a rider still holds the package, and the tracking the patient is\nwatching would go quiet with their medicines still in transit.\n\nAccepts an order that is dispensed but was never explicitly readied --\nready_for_pickup is a shelf state, and a pharmacist who dispensed and handed\nover in one motion did not skip a step, they did two at once. The walk\nthrough ready_for_pickup is still made rather than jumped, so the state\nmachine records both."
      summary: 'The patient collected it at the pharmacy'
      tags:
        - DispenseOrder
      parameters:
        -
          name: dispenseOrder
          in: path
          required: true
          description: 'The dispense order ID'
          schema:
            type: string
      responses:
        200:
          description: '`DispenseOrderResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/DispenseOrderResource' }
                      - { type: object, required: [items] }
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /health/live:
    get:
      operationId: health.live
      description: "It touches nothing. A liveness probe that queried the database would\nrestart healthy application containers during a database incident, which\nturns a recoverable outage into a thundering herd."
      summary: 'Liveness: this process is running'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: alive
                required:
                  - status
  /health/ready:
    get:
      operationId: health.ready
      description: "Database, Redis and storage. A 503 takes this instance out of the load\nbalancer rather than serving errors to patients."
      summary: 'Readiness: the dependencies needed to serve a request are reachable'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: string
  /health/isolation:
    get:
      operationId: health.isolation
      description: "PostgreSQL exempts a table's OWNER from row-level security. If the\napplication role owns a table -- or merely holds the right to create one,\nwhich is the same thing one careless migration later -- every isolation\npolicy becomes inert. The system then works perfectly and protects\nnothing: there is no error, no warning, and no behavioural test anywhere\nthat notices. That is why it is asserted here rather than assumed.\n\nA cross-tenant leak is a notifiable breach affecting two data controllers\nat once, so this failing is not a degraded service. It is an incident."
      summary: 'The isolation check. A SECURITY check, not an uptime check'
      tags:
        - Health
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: string
  '/v1/invitations/{token}/accept':
