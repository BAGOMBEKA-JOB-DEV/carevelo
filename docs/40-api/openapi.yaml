          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/patients/{patient}/merge':
    post:
      operationId: v1.patients.merge
      description: "Within a tenant only, and that is not enforced here: row-level security is\nbound before dispatch, so a patient identifier from another clinic does not\nresolve at all. There is no cross-tenant patient identity to merge onto and\nadding one would breach the isolation boundary.\n\nThe duplicate SURVIVES, pointing at the winner. Nobody deletes a patient --\nthe clinic may be obliged to retain the medical record, and a row that once\ncarried a consent decision has to stay explicable.\n\nWhat deliberately does NOT happen: the survivor's status is not recomputed\nfrom the consent records it inherits. If the duplicate was `active` and the\nsurvivor is `pending_consent`, the survivor stays `pending_consent` and the\nfront desk confirms consent through the consent surface. Silently promoting\na record to `active` because a different registration once consented is the\none failure mode here that ends with clinical data attached to a patient who\nnever agreed to any of it."
      summary: 'Fold a duplicate registration into this record'
      tags:
        - Patient
      parameters:
        -
          name: patient
          in: path
          required: true
          description: 'The patient ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePatientRequest'
      responses:
        200:
          description: '`PatientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PatientResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/payment-intents:
    post:
      operationId: v1.payments.store
      description: "Idempotency-Key is REQUIRED. Replaying it with an identical body returns\nthe stored response without re-executing; replaying with a different body\nis a client bug and returns 409, because silently processing it is how\nmoney goes missing."
      summary: 'Create a payment intent'
      tags:
        - PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payable_type:
                  type: string
                  enum:
                    - appointment
                    - dispense_order
                payable_id:
                  type: string
                amount_minor:
                  type: integer
                  minimum: 1
                method:
                  type: string
              required:
                - payable_type
                - payable_id
                - amount_minor
                - method
      responses:
        201:
          description: '`PaymentIntentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntentResource'
                required:
                  - data
        200:
          description: "Same key, same body: return what we stored. Do not re-execute.\n\n\n\n`PaymentIntentResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntentResource'
                required:
                  - data
        409:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: 'https://docs.carevelo.app/errors/idempotency_key_reused'
                  title:
                    type: string
                    const: 'This Idempotency-Key was used for a different request'
                  status:
                    type: integer
                    const: 409
                  code:
                    type: string
                    const: idempotency_key_reused
                required:
                  - type
                  - title
                  - status
                  - code
        400:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: 'https://docs.carevelo.app/errors/idempotency_key_required'
                  title:
                    type: string
                    const: 'An Idempotency-Key header is required'
                  status:
                    type: integer
                    const: 400
                  code:
                    type: string
                    const: idempotency_key_required
                  detail:
                    type: string
                    const: 'Generate a UUID and reuse it across retries of the same payment.'
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
        403:
          $ref: '#/components/responses/AuthorizationException'
