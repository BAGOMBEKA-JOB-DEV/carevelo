                - null
            surface:
              type:
                - string
                - 'null'
            logo_url:
              type:
                - string
                - 'null'
          required:
            - primary_colour
            - primary_foreground
            - secondary_colour
            - secondary_foreground
            - surface
            - logo_url
        contact:
          type: object
          properties:
            phone:
              type:
                - string
                - 'null'
            email:
              type:
                - string
                - 'null'
            physical_address:
              type:
                - string
                - 'null'
            district:
