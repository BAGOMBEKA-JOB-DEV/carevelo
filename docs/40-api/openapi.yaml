        - dispense_order_id
        - prescription_item_id
        - proposed_medicine_name
        - reason
        - status
        - proposed_by
        - proposed_at
        - decided_by
        - decided_at
      title: SubstitutionResource
    TenantAdminResource:
      type: object
      properties:
        id:
          type: string
        legal_name:
          type: string
        trading_name:
          type:
            - string
            - 'null'
        subdomain:
          type: string
          description: "Reported, and flagged as fixed, so a console can render the field\nas read-only rather than discovering the refusal on submit."
        subdomain_is_immutable:
          type: boolean
        status:
          type: string
        trial_ends_at:
          type:
