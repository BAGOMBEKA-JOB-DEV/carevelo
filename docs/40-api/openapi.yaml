    EndConsultationRequest:
      type: object
      description: "Ending a consultation.\n\nThe outcome is REQUIRED. A consultation that simply stops records nothing\nabout why, and the exception paths -- no-show, clinician unavailable, remote\ncare judged unsafe, technical failure -- are the ones the clinic needs to\ncount. `converted_to_in_person` additionally forbids any prescription, so it\nhas to be captured at the moment the clinician decides, not inferred later."
      properties:
        outcome:
          $ref: '#/components/schemas/ConsultationOutcome'
      required:
        - outcome
      title: EndConsultationRequest
    InviteStaffRequest:
      type: object
      description: "Inviting a member of staff by phone number.\n\nThe phone is the invitation address because it is the credential this market\nactually has: most Ugandan clinic staff have a working handset and no\nreliably checked email address.\n\nThe ROLE IS FIXED HERE, by the administrator, and the person accepting the\ninvitation cannot change it. Self-elevation on acceptance would make the\nwhole RBAC matrix advisory."
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
        role:
          type: string
          enum:
            - clinic_admin
            - clinician
            - pharmacist
            - dispatcher
            - front_desk
            - rider
      required:
        - name
        - phone
        - role
      title: InviteStaffRequest
    MergePatientRequest:
      type: object
      description: "Folding a duplicate registration into the record that survives.\n\nThe route's {patient} is the SURVIVOR and the body names the duplicate. That\nway round because the survivor is the record the front desk already has open,\nand because it makes the URL the thing that is kept -- a caller who confuses\nthe two loses the wrong history in a way no validation could detect.\n\n`exists` is evaluated with row-level security bound, so an identifier from\nanother clinic does not resolve and the response is the same as for one that\nnever existed. The isolation boundary is not something this endpoint has to\nremember to check."
      properties:
        duplicate_patient_id:
          type: string
      required:
        - duplicate_patient_id
      title: MergePatientRequest
    NotificationChannel:
      type: string
      description: "The channels a notification may leave the platform on. Both are UNTRUSTED transports. SMS transits the mobile operator and lands on a lock screen; WhatsApp Business API is hosted outside Uganda and so is a cross-border transfer as well. Neither may ever carry clinical content.  In-app is deliberately absent: it is not a notification channel, it is where the clinical content actually lives, behind authentication.\n"
      enum:
        - sms
        - whatsapp
      title: NotificationChannel
    NotificationStatus:
      type: string
      description: "The lifecycle of one outbound message. `sent` means the gateway accepted it, which is NOT the same as the handset receiving it — that is `delivered`, and only where the gateway reports receipts. The distinction matters when a patient says they were never told.\n"
      enum:
        - queued
        - sent
        - delivered
        - failed
      title: NotificationStatus
