          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/rider/deliveries/{delivery}':
    get:
      operationId: v1.rider.deliveries.show
      description: "WITHOUT THIS THE WINDOW ON THE LISTING WOULD BE COSMETIC. A rider who read\na delivery yesterday holds its identifier, and a `show` with no bound would\nhand back the recipient, the telephone number and the address for as long\nas the row exists. The listing decides what a rider may DISCOVER; this\ndecides what they may still READ, and the two have to agree or only the\nweaker one is true.\n\n404 RATHER THAN 403 for a delivery that has aged out, for the reason every\nrefusal on this surface is a 404: a rider must learn nothing from the\ndifference between \"not yours\" and \"does not exist\", and an address that is\nno longer theirs to read is no longer theirs to be told about either.\n\nACTIVE WORK IS NEVER AGED OUT, however long it has been sitting there. The\nreconciliation read the rider app performs after a lost connection also\nlands here, seconds after the transition it is checking, so it is never\nnear the edge of the window."
      summary: "One of the rider's own assignments — subject to the same window"
      tags:
        - RiderDelivery
      parameters:
        -
          name: delivery
          in: path
          required: true
          description: 'The delivery ID'
