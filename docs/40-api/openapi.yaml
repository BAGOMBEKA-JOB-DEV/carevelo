    UpdateAggregatorAccountRequest:
      type: object
      description: "The CLINIC'S OWN merchant credentials at a BoU-licensed aggregator.\n\nThere is no platform merchant account. Carevelo has none, will never have\none, and could not use one without becoming a payment service provider under\nthe NPS Act 2020 -- so every credential in this payload belongs to the clinic\nand every shilling collected with it settles directly to the clinic.\n\nPUT rather than PATCH, and `secret_key` is required: a partial credential\nupdate produces a half-rotated key pair that fails at the aggregator hours\nlater, in production, on a live collection.\n\nNothing validated here is ever returned. The response carries provider,\nstatus, environment and the last verification time, and no endpoint anywhere\nin this API reads a credential back."
      properties:
        provider:
          type: string
          enum:
            - flutterwave
            - pesapal
        environment:
          type: string
          enum:
            - sandbox
            - live
        public_key:
          type:
            - string
            - 'null'
          maxLength: 255
        secret_key:
          type: string
          minLength: 8
          maxLength: 255
        webhook_secret:
          type:
            - string
            - 'null'
          maxLength: 255
        merchant_reference:
          type:
            - string
            - 'null'
          description: "The clinic's own reference at the aggregator, used so it can match\na collection to a line on its own dashboard unaided."
          maxLength: 64
      required:
        - provider
        - environment
        - secret_key
      title: UpdateAggregatorAccountRequest
    UpdateClinicianRequest:
      type: object
      description: "Correcting a clinician's registration details, or completing them.\n\nThis endpoint exists because of one line in the PRD: a clinician whose\nregistration number is not to hand is saved with `can_prescribe = false` and\nprompted to complete it before prescribing. Without a way back in, that\nprompt has nowhere to lead and the clinic is stuck with a colleague who can\nbe booked but can never prescribe.\n\nPATCH, so every field is `sometimes`: a partial update that blanked the\nregistration number because the client omitted it would silently strip a\nclinician of the right to prescribe."
      properties:
        registration_body:
          $ref: '#/components/schemas/RegistrationBody'
        registration_number:
          type:
            - string
            - 'null'
          maxLength: 100
        practising_licence_expires_at:
          type:
            - string
            - 'null'
          format: date-time
        specialty:
          type:
            - string
            - 'null'
          maxLength: 200
        can_prescribe:
          type: boolean
        tenant_id:
          type: string
        user_id:
          type: string
      title: UpdateClinicianRequest
    UpdatePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - current_password
        - password
        - password_confirmation
      title: UpdatePasswordRequest
    UpdatePatientRequest:
      type: object
      description: "Correcting a patient's contact and demographic details.\n\n`status` is absent by design. A patient moves between states through consent\ndecisions and phone verification, never through a field assignment -- a\nstatus column anything can write is not a state machine."
      properties:
        given_name:
          type: string
          maxLength: 100
        family_name:
          type: string
          maxLength: 100
        phone:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        date_of_birth:
          type:
            - string
            - 'null'
          format: date-time
        sex:
          type:
            - string
            - 'null'
          enum:
            - female
            - male
            - other
            - prefer_not_to_say
            - null
        national_id_number:
          type:
            - string
            - 'null'
          maxLength: 32
        address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        guardian_name:
          type:
            - string
            - 'null'
          maxLength: 200
        guardian_phone:
          type:
            - string
            - 'null'
        guardian_relationship:
          type:
            - string
            - 'null'
          maxLength: 60
      title: UpdatePatientRequest
    UpdateServiceRequest:
      type: object
      description: "Amends a service the clinic already offers.\n\nEvery field is optional, so a price change is a request carrying only\n`price_minor`. Unknown fields are still rejected -- a mistyped `price_minor`\nthat validated as \"nothing to change\" is how a clinic discovers weeks later\nthat it has been charging the old amount."
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        price_minor:
          type: integer
          description: 'Integer minor units. Never a float.'
          minimum: 0
          maximum: 100000000000
        currency:
          anyOf:
            -
              $ref: '#/components/schemas/Currency'
            -
              type: 'null'
        modes:
          type:
            - array
            - 'null'
          description: "Which modes the clinic considers safe for this service is a\nclinical judgement belonging to the clinic. We record it."
          items:
            $ref: '#/components/schemas/ConsultationMode'
          maxItems: 4
        eligible_roles:
          type:
            - array
            - 'null'
          items:
            type: string
            enum:
              - clinic_admin
              - clinician
              - pharmacist
              - dispatcher
              - front_desk
              - rider
              - patient
          maxItems: 7
        is_active:
          type:
            - boolean
            - 'null'
      title: UpdateServiceRequest
    UpdateStaffRequest:
      type: object
      description: "Correcting a staff member's details, role or access.\n\n`tenant_id` is prohibited rather than absent. Moving a person between clinics\nis never legitimate -- there is no cross-tenant staff identity, so someone\nworking at two clinics has two accounts -- and a prohibited field says that\nout loud instead of discarding the value in silence.\n\nPasswords are not set here. A person sets their own; an administrator who\ncould write another user's password could read every clinical record that user\ncan reach, which defeats the role boundary entirely.\n\nThe one place a password is issued rather than chosen is a patient account\ncreated at the registration desk, where there is no other way to hand somebody\ntheir first credential. Even there the staff member does not choose it: the\nserver generates it, shows it once, and the account can do nothing but replace\nit until it does."
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        is_active:
          type: boolean
        role:
          type: string
          enum:
            - clinic_admin
            - clinician
            - pharmacist
            - dispatcher
            - front_desk
            - rider
        tenant_id:
          type: string
        password:
          type: string
      title: UpdateStaffRequest
    UpdateTenantRequest:
      type: object
      description: "The platform's lever on a clinic: its lifecycle state and its trial.\n\nCOMMERCIAL fields only. Branding, contact details, services and staff belong\nto the clinic and are changed through the clinic's own admin endpoints — a\nplatform operator editing a clinic's brand is a support incident, not a\nfeature.\n\nSuspension is likewise commercial and never clinical. It blocks staff\nsign-in; it does not stop a patient reading their own records or a delivery\nalready in flight, and nothing in this request could make it do so."
      properties:
        status:
          description: "Whether the move is legal is TenantStatus's decision, not a\nvalidation rule's: a state machine with its transitions restated\nin a form request has two definitions and one of them will drift."
          $ref: '#/components/schemas/TenantStatus'
        trial_ends_at:
          type:
            - string
            - 'null'
          format: date-time
      title: UpdateTenantRequest
    UpdateWorkingHoursRequest:
      type: object
      description: "Replaces the clinic's whole week of opening hours.\n\nPUT on a collection, so the body is the timetable in full rather than a\npatch. A clinic that stops opening on Saturdays says so by sending a week\nwithout Saturday, and a partial-update endpoint would leave that Saturday\nquietly published to patients forever.\n\n`day_of_week` is 0 = Sunday, matching Carbon. It is `distinct` because the\ntable is uniquely keyed on (tenant_id, day_of_week): two Mondays in one body\nis a client bug, and letting the second silently win means the clinic sees\nhours it did not choose."
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              day_of_week:
                type: integer
                minimum: 0
                maximum: 6
              opens_at:
                type:
                  - string
                  - 'null'
                description: "Not required on a day the clinic is shut: the columns are NOT\nNULL, so the controller stores midnight-to-midnight and nothing\never reads it while is_closed is true."
              closes_at:
                type:
                  - string
                  - 'null'
              is_closed:
                type:
                  - boolean
                  - 'null'
            required:
              - day_of_week
          minItems: 1
          maxItems: 7
          uniqueItems: true
      required:
        - days
      title: UpdateWorkingHoursRequest
    UploadLogoRequest:
      type: object
      description: "The clinic's logo, which appears on the patient portal, the prescription PDF\nand every receipt.\n\nThese rules are the FIRST of two checks. They reject the obvious -- wrong\ntype, too large, too small, absurd dimensions -- on the strength of the\ndeclared MIME type and the image headers. The declared type is a claim by\nthe uploader, so the controller then decodes and re-encodes the bytes\nserver-side; a file that survives both is an image and carries no metadata."
      properties:
        logo:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: 'Maximum file size: 512 kilobytes.'
      required:
        - logo
      title: UploadLogoRequest
