  /v1/join-tokens/redeem:
    post:
      operationId: v1.consultations.join.redeem
      description: "The token arrives in the BODY, never in the path. A secret in a URL is\nwritten to the web server's access log, kept in the browser's history, and\nhanded to whatever the page links to next in the Referer header. None of\nthose are places a credential that opens a consultation may sit."
      summary: 'Spend a token and return the credentials to enter the room'
      tags:
        - JoinToken
