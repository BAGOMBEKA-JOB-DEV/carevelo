        - reference
        - recipient_name
        - recipient_phone
        - address_text
        - district
        - landmark
        - status
      title: RiderDeliveryResource
    ServiceResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        duration_minutes:
          type: integer
        price:
          type: object
          description: "`price_minor` is NOT NULL with a zero default, so there is always\nan amount to publish -- a service with no price is priced at zero,\nwhich is a decision the clinic can legitimately make."
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
          required:
            - amount_minor
            - currency
        modes:
          type: array
          description: "Voice and chat are first-class choices, not fallbacks, so the\nclient needs the full list to offer them as equals."
          items:
            type: string
        eligible_roles:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
      required:
