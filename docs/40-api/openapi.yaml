        method:
          type: string
        aggregator_reference:
          type:
            - string
            - 'null'
        redirect_url:
          type:
            - string
            - 'null'
          description: "The aggregator's hosted payment page, where one exists. Present only for a provider that is initiated server-side --\nPesapal today. Null is the ordinary answer for Flutterwave, whose\ncollection the client starts itself, and for cash at the clinic,\nwhere nobody is going anywhere.\n\nIt is a place to send the patient, NOT a confirmation of\nanything. A client that treats the presence of this URL as a paid\nbooking has confirmed a booking nobody has paid for: the intent\nis `initiated` at this point, and only the aggregator can say\nwhat happens next."
