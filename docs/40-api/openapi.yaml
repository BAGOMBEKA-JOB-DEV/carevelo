                      database: { anyOf: [{ type: object, properties: { role: { type: string }, isolation_enforced: { type: string } }, required: [role, isolation_enforced] }, { type: object, properties: { role: { type: 'null' }, isolation_enforced: { type: boolean } }, required: [role, isolation_enforced] }] }
                      tenants: { type: object, additionalProperties: { type: integer } }
                      break_glass: { type: object, description: "Surfaced next to uptime on purpose. A rising number of live\ngrants means the metadata-based support tooling is INADEQUATE,\nnot that more access is needed, and a figure nobody sees is a\nfigure nobody acts on.", properties: { active_grants: { type: integer, minimum: 0 } }, required: [active_grants] }
