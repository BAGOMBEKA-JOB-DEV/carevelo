  /v1/deliveries:
    get:
      operationId: v1.deliveries.index
      description: "==================================================================\nWHY THE PATIENT BRANCH EXISTS AT ALL\n==================================================================\n\n`DeliveryPolicy::viewOwn()` has admitted a patient since it was written and\nnothing called it, so a patient could `track` a delivery only if they\nALREADY held its identifier — and nothing they were allowed to call ever\nhanded them one. The whole journey of watching a package therefore had no\nentry point in the portal: it opened from a link the clinic sent, or not at\nall. This is that entry point.\n\n==================================================================\nTHE PROJECTION IS THE DECISION, NOT THE QUERY\n==================================================================\n\n`authoriseListing()` guarantees the patient branch returns only rows that\nreach one of this account's own patient records. What it cannot decide is\nwhat a row SAYS, and `DeliveryResource` — the dispatcher's projection —\ncarries the recipient block, the street address, the landmark, the rider\nand `failure_reason`. Serving that to a patient would quietly widen\n`track` into `view`, which `DeliveryPolicy` splits on purpose.\n\nSo the patient branch renders `PatientDeliveryResource`: the TRACKING\nshape, which is milestones rather than contents, and which that class\nargues field by field. The two projections are two classes rather than one\nclass with a conditional, for the same reason the rider has his own.\n\nWHY THE GATE IS ASKED TWICE. `authoriseListing()` decides authorisation and\nnarrowing together — deliberately, so neither can be had without the other\n— and hands back a builder, not a verdict. The line below asks a DIFFERENT\nquestion of the same gate: not \"may this caller list?\" but \"which of the\n     * two audiences is this?\". Reading a flag off the trait would make the\nprojection look like a by-product of the authorisation; asking plainly\nmakes it a decision somebody wrote down.\n\nCURSOR FOR THE PATIENT, OFFSET STILL FOR THE BOARD, AND THAT ASYMMETRY IS\nTEMPORARY AND DELIBERATE. The house rule is cursor pagination, and the new\nlisting gets it from its first day. The board keeps `paginate()` because\n`meta.total` is what the clinic console reads to warn a pharmacist that a\nlane holds more work than one page can carry, and `cursorPaginate()` does\nnot produce a total. Moving the board is the right change and it is a\nchange to those screens as well as to this line, which this one does not\nown; see `apps/clinic-console/src/domains/delivery/api/deliveries.ts`,\nwhich already says it is sending an offset under protest."
      summary: "Two listings behind one route: the dispatch board, and the patient's own\ndeliveries"
      tags:
        - Delivery
      parameters:
        -
          name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
        -
          name: rider_id
          in: query
          schema:
            type: string
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: cursor
          in: query
          description: "Opaque and never parsed here. It is read by cursorPaginate() and\nhanded straight back out again."
          schema:
            type: string
      responses:
        200:
          description: "Paginated set of `DeliveryResource`\n\nPaginated set of `PatientDeliveryResource`"
          content:
            application/json:
              schema:
                anyOf:
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DeliveryResource' } }
                      links: { type: object, properties: { first: { type: [string, 'null'] }, last: { type: [string, 'null'] }, prev: { type: [string, 'null'] }, next: { type: [string, 'null'] } }, required: [first, last, prev, next] }
                      meta: { type: object, properties: { current_page: { type: integer, minimum: 1 }, from: { type: [integer, 'null'], minimum: 1 }, last_page: { type: integer, minimum: 1 }, links: { type: array, description: 'Generated paginator links.', items: { type: object, properties: { url: { type: [string, 'null'] }, label: { type: string }, active: { type: boolean } }, required: [url, label, active] } }, path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }, per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }, to: { type: [integer, 'null'], description: 'Number of the last item in the slice.', minimum: 1 }, total: { type: integer, description: 'Total number of items being paginated.', minimum: 0 } }, required: [current_page, from, last_page, links, path, per_page, to, total] }
                    required:
                      - data
                      - links
                      - meta
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PatientDeliveryResource' } }
                      links: { type: object, properties: { first: { type: [string, 'null'] }, last: { type: [string, 'null'] }, prev: { type: [string, 'null'] }, next: { type: [string, 'null'] } }, required: [first, last, prev, next] }
                      meta: { type: object, properties: { path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }, per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }, next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }, prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' } }, required: [path, per_page, next_cursor, prev_cursor] }
                    required:
                      - data
                      - links
                      - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
    post:
      operationId: v1.deliveries.store
      description: "Two refusals live here and neither has an override:\n\n  1. an order holding a controlled item never enters the delivery flow\n     (NDPA Act Cap 206) — enforced by Delivery::createFor();\n  2. an address is never prepared for a rider without the patient's\n     delivery_disclosure consent (DPPA 2019)."
      summary: 'Dispatch a dispensed order'
      tags:
