          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/webhooks/pesapal/{tenant}':
    get:
      operationId: webhooks.pesapal
      description: "Trusted for nothing. `OrderTrackingId` is the only field read, and it is\nused solely to look up an attempt within the named tenant and to ask\nPesapal, over TLS with the clinic's own credentials, what became of it.\nEverything this endpoint acts on comes from that answer.\n\nAlways answers `{\"received\": true}` with 200, or a neutral 404 that does\nnot distinguish an unknown tenant from an unconfigured clinic from an\nunknown tracking id.\n\nSee docs/70-decisions/0012-pesapal-unsigned-ipn.md"
      summary: 'Receive a Pesapal instant payment notification'
      tags:
        - PesapalIpn
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: OrderTrackingId
          in: query
          description: "THE ONLY PLACE THE REQUEST IS TOUCHED. `input()` reads the query\n string and the body alike, which is what the route's GET|POST needs:\n Pesapal registers a notification type per URL and has been known to\n send either."
          schema:
            type: string
      responses:
        200:
          description: "From here the Request no longer exists as far as this handler is\nconcerned. That is not tidiness; it is the property the docblock\nabove claims, expressed as a signature."
          content:
            application/json:
              schema:
                type: object
        404:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'Not found'
                  status:
                    type: integer
                    const: 404
                  code:
                    type: string
                    const: not_found
                  detail:
                    type: 'null'
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
