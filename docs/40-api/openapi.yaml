    TenantResource:
      type: object
      properties:
        id:
          type: string
        trading_name:
          type: string
        branding:
          type: object
          description: "The RESOLVED token set, not the raw colours. This endpoint feeds the patient portal, which is the surface that has\nto stay readable — and until now it returned primary_colour and\nsecondary_colour with no foreground, so the client would have had to\ncompute contrast itself. That contradicts the rule that branding\ntokens are \"validated server-side before reaching the client\" and\n\"arrive as a strict, typed set\", and it would have meant two\nimplementations of the same WCAG maths, free to disagree.\n\nAdvisories are deliberately absent: they are guidance for the\nadministrator who chose the colour."
          properties:
            primary_colour:
              type:
                - string
                - 'null'
            primary_foreground:
              type:
                - string
                - 'null'
              enum:
