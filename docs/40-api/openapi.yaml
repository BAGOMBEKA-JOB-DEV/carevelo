        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/patients/{patient}/merge':
    post:
      operationId: v1.patients.merge
      description: "Within a tenant only, and that is not enforced here: row-level security is\nbound before dispatch, so a patient identifier from another clinic does not\nresolve at all. There is no cross-tenant patient identity to merge onto and\nadding one would breach the isolation boundary.\n\nThe duplicate SURVIVES, pointing at the winner. Nobody deletes a patient --\nthe clinic may be obliged to retain the medical record, and a row that once\ncarried a consent decision has to stay explicable.\n\nWhat deliberately does NOT happen: the survivor's status is not recomputed\nfrom the consent records it inherits. If the duplicate was `active` and the\nsurvivor is `pending_consent`, the survivor stays `pending_consent` and the\nfront desk confirms consent through the consent surface. Silently promoting\na record to `active` because a different registration once consented is the\none failure mode here that ends with clinical data attached to a patient who\nnever agreed to any of it."
      summary: 'Fold a duplicate registration into this record'
      tags:
        - Patient
      parameters:
        -
          name: patient
          in: path
          required: true
          description: 'The patient ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePatientRequest'
      responses:
        200:
          description: '`PatientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PatientResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/patients/{patient}/account':
    post:
      operationId: v1.patients.account.store
      summary: 'Create the account, link the record, and return the password once'
      tags:
        - PatientAccount
      parameters:
        -
          name: patient
          in: path
          required: true
          description: 'The patient ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientAccountRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      patient_id: { type: string }
                      user_id: { type: string }
                      email: { type: [string, 'null'] }
                      initial_password: { type: string, description: "The only moment the plaintext exists outside the patient's own\nhead. It is stored as a hash, never audited, never logged, and\nnever sent by SMS." }
                      records_linked: { type: integer, description: "Always one: the endpoint creates a fresh account and links the\nsingle record it was called on. It is here so the desk can see\nthat the link happened, because the link -- not the account --\nis what puts records in front of the patient.", const: 1 }
                      note: { type: string }
                    required:
                      - patient_id
                      - user_id
                      - email
                      - initial_password
                      - records_linked
                      - note
                required:
                  - data
        409:
          description: "The unique index on (tenant_id, email) settled the race, or the\naddress belongs to a DEACTIVATED account -- which activeForEmail()\ndeliberately does not see, because a \"your account is disabled\"\nanswer at sign-in would confirm the account exists.\n\nA 409 rather than a neutral 201 is right here and nowhere near\nsign-in: the caller is an authenticated member of staff who can\nalready read every patient record and every address at this clinic,\nso there is no enumeration surface to protect. What there is\ninstead is a person standing at a desk who needs to be told the\ntruth about why they cannot proceed."
          content:
            application/problem+json:
              schema:
                anyOf:
                  -
                    type: object
                    properties:
                      type: { type: string }
                      title: { type: string, const: 'That address already has an account at this clinic' }
                      status: { type: integer, const: 409 }
                      code: { type: string, const: account_exists }
                      detail: { type: string, const: 'Use a different address, or ask the patient to sign in with the one they have.' }
                      errors: { type: string }
                    required:
                      - type
                      - title
                      - status
                      - code
                      - detail
                      - errors
                  -
                    type: object
                    properties:
                      type: { type: string }
                      title: { type: string, const: 'This patient already has an account' }
                      status: { type: integer, const: 409 }
                      code: { type: string, const: patient_already_has_account }
                      detail: { type: string }
                      errors: { type: string }
                    required:
                      - type
                      - title
                      - status
                      - code
                      - detail
                      - errors
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/payment-intents:
    post:
      operationId: v1.payments.store
      description: "Idempotency-Key is REQUIRED. Replaying it with an identical body returns\nthe stored response without re-executing; replaying with a different body\nis a client bug and returns 409, because silently processing it is how\nmoney goes missing. That guard now protects a real outbound call as well\nas a row: without it, a retried request would submit a SECOND order\nagainst the patient's name.\n\nTHE HANDOFF IS NOT A PAYMENT. Where the aggregator supports server-side\ninitiation -- Pesapal does, Flutterwave does not -- we tell the CLINIC'S\nOWN aggregator that a collection is expected and return the page the\npatient pays on. The patient then pays the aggregator and the aggregator\nsettles to the clinic. Nothing passes through Carevelo at any point, and\nno account exists here for it to pass through."
      summary: 'Create a payment intent'
      tags:
        - PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payable_type:
                  type: string
                  enum:
                    - appointment
                    - dispense_order
                payable_id:
                  type: string
                amount_minor:
                  type: integer
                  minimum: 1
                method:
                  type: string
              required:
                - payable_type
                - payable_id
                - amount_minor
                - method
      responses:
        201:
          description: '`PaymentIntentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntentResource'
                required:
                  - data
        200:
          description: "Same key, same body: return what we stored. Do not re-execute.\n\n\n\n`PaymentIntentResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntentResource'
                required:
                  - data
        409:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: 'https://docs.carevelo.app/errors/idempotency_key_reused'
                  title:
                    type: string
                    const: 'This Idempotency-Key was used for a different request'
                  status:
                    type: integer
                    const: 409
                  code:
                    type: string
                    const: idempotency_key_reused
                required:
                  - type
                  - title
                  - status
                  - code
        400:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: 'https://docs.carevelo.app/errors/idempotency_key_required'
                  title:
                    type: string
                    const: 'An Idempotency-Key header is required'
                  status:
                    type: integer
                    const: 400
                  code:
                    type: string
                    const: idempotency_key_required
                  detail:
                    type: string
                    const: 'Generate a UUID and reuse it across retries of the same payment.'
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
        403:
          $ref: '#/components/responses/AuthorizationException'
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/payment-intents/{paymentIntent}':
    get:
      operationId: v1.payments.show
      tags:
        - PaymentIntent
