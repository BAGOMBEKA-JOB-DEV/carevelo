          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/payment-intents/{paymentIntent}/receipt':
    get:
      operationId: v1.payments.receipt
      description: "Carevelo appears nowhere on it in that role, because the clinic is what\nreceived the money: the patient paid the clinic's own merchant account and\nthe aggregator settled to the clinic direct. A receipt naming us would be\na false document and a claim of custody at once.\n\nOnly a succeeded intent has one. The precondition and the payee lookup\nlive in PaymentReceipt."
      summary: 'The receipt. It NAMES THE CLINIC AS PAYEE'
      tags:
        - PaymentIntent
      parameters:
        -
          name: paymentIntent
          in: path
