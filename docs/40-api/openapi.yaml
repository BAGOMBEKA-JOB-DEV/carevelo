    PriceDispenseOrderRequest:
      type: object
      description: "Pricing an order at the clinic's own prices.\n\nCarevelo does not price medicines and takes no margin on one. Every amount\nhere is the clinic's, typed by the clinic's own pharmacist, and the platform\nonly records it.\n\nPrices are integer minor units. There is no field that accepts a decimal\nanywhere in this payload, because the moment a fee split or a percentage\nlands on a fractional amount the rounding becomes a financial defect."
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              prescription_item_id:
                type: string
              medicine_name_dispensed:
                type: string
                description: "What is actually going in the bag, which may differ from what was\nprescribed. Recorded separately from the prescription so both\nfacts survive."
                maxLength: 255
              quantity_dispensed:
                type: integer
                minimum: 0
              unit_price_minor:
                type: integer
                minimum: 0
              substitution_id:
                type:
                  - string
                  - 'null'
                description: "Set when this line is being filled with an APPROVED substitute.\nThe controller refuses the id if the substitution is not approved\nand not for this order -- shape here, decision there."
              is_fulfilled:
                type: boolean
                description: "Partial fill. An unfulfilled line must say why, so the clinician\ncan later see which item the patient never received rather than\nfinding a silent gap."
              unfulfilled_reason:
                type:
                  - string
                  - 'null'
                maxLength: 255
            required:
              - prescription_item_id
              - medicine_name_dispensed
              - quantity_dispensed
              - unit_price_minor
          minItems: 1
        delivery_fee_minor:
          type: integer
          minimum: 0
      required:
        - items
      title: PriceDispenseOrderRequest
