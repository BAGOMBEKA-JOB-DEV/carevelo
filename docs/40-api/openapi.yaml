    WithdrawConsentRequest:
      type: object
      description: "Withdrawal of one previously granted consent.\n\nWithdrawal is per type for the same reason granting is: a patient who no\nlonger wants remote consultations has not necessarily withdrawn consent to be\ntreated at all, and collapsing the two would either over-read or under-read\nwhat they actually said.\n\nNo policy version is accepted here. A withdrawal inherits the version and\ntext hash of the grant it revokes -- that is the text the patient is walking\nback, and pinning the current wording instead would rewrite history."
      properties:
        consent_type:
          type: string
          enum:
            - data_processing
            - telemedicine
            - delivery_disclosure
      required:
        - consent_type
      title: WithdrawConsentRequest
    WorkingHourResource:
      type: object
      properties:
        day_of_week:
          type: integer
        day:
          type: string
        opens_at:
          type: string
        closes_at:
          type: string
        is_closed:
          type: boolean
      required:
        - day_of_week
        - day
        - opens_at
        - closes_at
        - is_closed
      title: WorkingHourResource
