openapi: 3.1.0
info:
  title: Laravel
  version: 0.0.1
servers:
  -
    url: 'http://localhost/api'
paths:
  /v1/tenant/aggregator-account:
    get:
      operationId: v1.aggregator.show
      description: "Four facts and no secret. Returns 200 with `unconfigured` when the clinic\nhas no account at all -- a 404 would read to a console as an error and\ninvite it to block booking over a feature the clinic has chosen not to\nuse."
      summary: 'Provider, status, environment and the last verification time'
      tags:
        - AggregatorAccount
      responses:
        200:
          description: '`AggregatorAccountResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AggregatorAccountResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    put:
      operationId: v1.aggregator.update
      description: "The status drops to `pending_verification` on every write, including a\nwrite that only rotates the webhook secret. An untested credential\nclaiming to be `active` is how a clinic discovers at the counter that its\nkey expired last week."
      summary: "Store the clinic's credentials, replacing whatever was there"
      tags:
        - AggregatorAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAggregatorAccountRequest'
      responses:
        200:
          description: '`AggregatorAccountResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AggregatorAccountResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/tenant/aggregator-account/verify:
    post:
      operationId: v1.aggregator.verify
      description: "A READ, not a transaction. The gateway is asked about an attempt that\ndoes not exist, which exercises exactly what needs exercising -- whether\nthe aggregator accepts this clinic's key -- and moves no money at all.\nInitiating a real collection to test a credential would mean charging\nsomebody to prove a configuration, and there is no platform account for\nthe shilling to land in.\n\nEach provider has its own harmless equivalent of that question, and the\ngateway chooses it: Flutterwave is asked to verify a reference it has\nnever seen, and Pesapal is asked for a token, which is the only call it\noffers that tests a credential without creating an order. The probe below\ncarries no tracking id, and that absence is what selects the second path.\n\nA provider with no client at all is refused by the resolver with the same\nAggregatorUnavailable, so verification stays truthful rather than silent.\n\nAn unreachable or rejecting aggregator sets `failing` and returns the\naggregator's own message. Only they know why a key was refused, and\nparaphrasing loses the part the administrator can act on."
      summary: 'Check the credentials against the aggregator'
      tags:
        - AggregatorAccount
      responses:
        200:
          description: '`AggregatorAccountResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AggregatorAccountResource'
                  meta:
                    type: object
                    properties:
                      verification_message: { type: string }
                    required:
                      - verification_message
                required:
                  - data
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/webhooks/{provider}/{tenant}':
    post:
      operationId: webhooks.aggregator
      tags:
        - AggregatorWebhook
      parameters:
        -
          name: provider
          in: path
          required: true
          schema:
            type: string
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
  /v1/appointments:
    get:
      operationId: v1.appointments.index
      summary: "The clinic's schedule, filtered"
      tags:
        - Appointment
      parameters:
        -
          name: status
          in: query
          schema:
            anyOf:
              -
                $ref: '#/components/schemas/AppointmentStatus'
              -
                type: 'null'
        -
          name: clinician_id
          in: query
          schema:
            type:
              - string
              - 'null'
        -
          name: from
          in: query
          schema:
            type:
              - string
              - 'null'
            format: date-time
        -
          name: to
          in: query
          schema:
            type:
              - string
              - 'null'
            format: date-time
        -
          name: sort
          in: query
          schema:
            type:
              - string
              - 'null'
            enum:
              - scheduled_start_at
              - '-scheduled_start_at'
              - null
        -
          name: per_page
          in: query
          schema:
            type:
              - integer
              - 'null'
            minimum: 1
            maximum: 100
        -
          name: cursor
          in: query
          schema:
            type:
              - string
              - 'null'
      responses:
        200:
          description: 'Paginated set of `AppointmentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
    post:
      operationId: v1.appointments.store
      description: "Prepaid opens in `awaiting_payment`; pay-at-clinic goes straight to\n`confirmed`. Both are legitimate first states -- a clinic whose\naggregator is not configured still books patients, because payment is a\nfeature and care is not blocked on it (§H1.6)."
      summary: 'Book a slot'
      tags:
        - Appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAppointmentRequest'
      responses:
        201:
          description: '`AppointmentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/appointments/{appointment}':
    get:
      operationId: v1.appointments.show
      tags:
        - Appointment
      parameters:
        -
          name: appointment
          in: path
          required: true
          description: 'The appointment ID'
          schema:
            type: string
      responses:
        200:
          description: '`AppointmentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/v1/appointments/{appointment}/cancel':
    post:
      operationId: v1.appointments.cancel
      description: "The state machine decides whether this is legal; a completed or already\ncancelled appointment throws rather than quietly accepting a second\ncancellation."
      summary: 'Cancel, releasing the slot immediately'
      tags:
        - Appointment
      parameters:
        -
          name: appointment
          in: path
          required: true
          description: 'The appointment ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        200:
          description: '`AppointmentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/appointments/{appointment}/confirm-deferred':
    post:
      operationId: v1.appointments.confirm-deferred
      description: "The administrator is vouching for a patient who will settle at the desk,\nor whose mobile-money transfer the clinic has seen and we have not. It is\na deliberate override of the normal precondition, so it is restricted to\nthe administrator by policy and always audited -- an unaudited way to\nmark something paid is an invitation."
      summary: "Confirm an unpaid appointment on a staff member's authority (§H3.3)"
      tags:
        - Appointment
      parameters:
        -
          name: appointment
          in: path
          required: true
          description: 'The appointment ID'
          schema:
            type: string
      responses:
        200:
          description: '`AppointmentResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/audit-events:
    get:
      operationId: v1.audit-events.index
      tags:
        - AuditEvent
      parameters:
        -
          name: action
          in: query
          schema:
            type: string
            maxLength: 64
        -
          name: actor_id
          in: query
          schema:
            type: string
        -
          name: subject_type
          in: query
          schema:
            type: string
            maxLength: 64
        -
          name: subject_id
          in: query
          schema:
            type: string
        -
          name: from
          in: query
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          schema:
            type: string
            format: date
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        -
          name: cursor
          in: query
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `AuditEventResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEventResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/auth/sign-in:
    post:
      operationId: v1.auth.sign-in
      summary: 'Sign in with an email address or a phone number, and a password'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        200:
          description: "The same resource /v1/me returns, and for the same reason: handing back the raw\nEloquent model shipped tenant_id, is_active, both timestamps and — once the\nstaff-issued account path landed — password_change_required_at, to a browser that\nneeds none of them. A client that has just signed in wants exactly what it would\nask /v1/me for, so it gets exactly that.\n\n\n\n`MeResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeResource'
                required:
                  - data
        403:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'This clinic account is suspended'
                  status:
                    type: integer
                    const: 403
                  code:
                    type: string
                    const: tenant_suspended
                  detail:
                    type: string
                    const: 'Staff sign-in is unavailable until the clinic account is reactivated.'
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        429:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                    const: 'Too many attempts'
                  status:
                    type: integer
                    const: 429
                  code:
                    type: string
                    const: too_many_attempts
                  detail:
                    type: string
                    const: 'Wait a few minutes and try again.'
                  errors:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - errors
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/me:
    get:
      operationId: v1.me
      description: "A controller method rather than the route closure this used to be, so the\npublished contract can describe it: a closure returning an Eloquent model\nis the one endpoint Scramble had nothing to say about, which is why the\nfrontend kept a hand-written type for it.\n\nReachable while a password change is outstanding -- see\nRequirePasswordChange. It is how a client learns that it must show the\npassword form rather than finding out one refusal at a time."
      summary: 'Who am I, and may I do anything yet'
      tags:
        - Auth
      responses:
        200:
          description: '`MeResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeResource'
                required:
                  - data
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/auth/sign-out:
    post:
      operationId: v1.auth.sign-out
      tags:
        - Auth
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/me/password:
    post:
      operationId: v1.me.password
      description: "The person doing this is often doing it BECAUSE they believe someone else\nis signed in as them -- a clinic terminal left logged in at a front desk,\na handset that changed hands. A password change that leaves those sessions\nalive does nothing about the thing that prompted it."
      summary: 'Change your own password, ending every other session'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/availability:
    get:
      operationId: v1.availability.index
      tags:
        - Availability
      parameters:
        -
          name: service_id
          in: query
          required: true
          description: "Required: without a service there is no slot length, and a\nguessed default would publish slots the clinic never sized.\nScoped to active services -- a withdrawn service is not bookable\nby anyone, so it has no availability to report."
          schema:
            type: string
        -
          name: clinician_id
          in: query
          description: "Optional. Absent means every clinician, which is what a patient\nwith no preference is asking for."
          schema:
            type:
              - string
              - 'null'
        -
          name: from
          in: query
          schema:
            type:
              - string
              - 'null'
            format: date-time
        -
          name: to
          in: query
          schema:
            type:
              - string
              - 'null'
            format: date-time
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties: { clinician_id: { type: string }, starts_at: { type: string }, ends_at: { type: string } }
                      required: [clinician_id, starts_at, ends_at]
                  meta:
                    type: object
                    properties:
                      service_id: { type: string }
                      duration_minutes: { type: integer }
                      timezone: { type: string }
                      from: { type: string }
                      to: { type: string }
                    required:
                      - service_id
                      - duration_minutes
                      - timezone
                      - from
                      - to
                required:
                  - data
                  - meta
        422:
          $ref: '#/components/responses/ValidationException'
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /v1/platform/break-glass:
    post:
      operationId: v1.platform.break-glass.store
      description: "The grant is issued and the clinic is notified in one transaction. There\nis no window in which access exists and the controller has not been told."
      summary: 'Request a grant'
      tags:
        - BreakGlass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBreakGlassGrantRequest'
      responses:
        201:
          description: '`BreakGlassGrantResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BreakGlassGrantResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
    get:
      operationId: v1.platform.break-glass.index
      description: "Two readers, one list. A platform reviewer asks whether the count is\nrising — a rising count means the metadata-based support tooling is\ninadequate, not that access is needed. A clinic administrator asks what we\nread of theirs and when, and the policy narrows the list to their own\ntenant."
      summary: 'The grant register'
      tags:
        - BreakGlass
      parameters:
        -
          name: tenant_id
          in: query
          schema:
            type: string
        -
          name: active
          in: query
          schema:
            type: boolean
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: cursor
          in: query
          schema:
            type: string
      responses:
        200:
          description: 'Paginated set of `BreakGlassGrantResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreakGlassGrantResource'
                  links:
                    type: object
                    properties:
                      first: { type: [string, 'null'] }
                      last: { type: [string, 'null'] }
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      path: { type: [string, 'null'], description: 'Base path for paginator generated URLs.' }
                      per_page: { type: integer, description: 'Number of items shown per page.', minimum: 0 }
                      next_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the next set of items.' }
                      prev_cursor: { type: [string, 'null'], description: 'The "cursor" that points to the previous set of items.' }
                    required:
                      - path
                      - per_page
                      - next_cursor
                      - prev_cursor
                required:
                  - data
                  - links
                  - meta
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/consultations/{consultation}/notes':
    get:
      operationId: v1.notes.index
      summary: 'Every note on the consultation, oldest first, superseded ones included'
      tags:
        - ClinicalNote
      parameters:
        -
          name: consultation
          in: path
          required: true
          description: 'The consultation ID'
          schema:
            type: string
      responses:
        200:
          description: 'Array of `ClinicalNoteResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClinicalNoteResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: v1.notes.store
      description: "Drafts persist continuously as they are typed, so this endpoint accepts\nan unfinished note and stores it immediately. A lost connection must\nnever lose clinical text -- it is the single most likely cause of a\nclinician abandoning the product, and the text is often the only record\nof what was said.\n\nEach save is a new row rather than an overwrite, because the model\nforbids overwriting a body at all."
      summary: 'Save a note, including a partial one'
      tags:
        - ClinicalNote
      parameters:
        -
          name: consultation
          in: path
          required: true
          description: 'The consultation ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreClinicalNoteRequest'
      responses:
        201:
          description: '`ClinicalNoteResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalNoteResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/consultations/{consultation}/notes/{note}':
    patch:
      operationId: v1.notes.addendum
      description: "PATCH, but nothing is patched. The response is a NEW note of type\n`addendum` carrying `supersedes_note_id`; the note named in the path is\nuntouched and still returned by index(). Attempting to change its body\ninstead throws."
      summary: 'Correct a note by adding an addendum'
      tags:
        - ClinicalNote
      parameters:
        -
          name: consultation
          in: path
          required: true
          description: 'The consultation ID'
          schema:
            type: string
        -
          name: note
          in: path
          required: true
          description: 'The note ID'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddClinicalNoteAddendumRequest'
      responses:
        201:
          description: '`ClinicalNoteResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalNoteResource'
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /v1/clinicians:
    get:
      operationId: v1.clinicians.index
