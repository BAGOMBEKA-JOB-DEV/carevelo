            - 'null'
          format: email
          maxLength: 255
        physical_address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        umdpc_facility_reference:
          type:
            - string
            - 'null'
          description: "The clinic's OWN attestation. Carevelo has no access to the UMDPC\nor NDA registers and never presents these as verified."
          maxLength: 100
        nda_licence_reference:
          type:
            - string
            - 'null'
          maxLength: 100
        trial_ends_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
