      title: RiderDeliveryResource
    SecondFactorChallengeRequest:
      type: object
      description: "The code half of a platform operator's sign-in.\n\n============================================================\nONE OF TWO CREDENTIALS, NEVER BOTH\n============================================================\n\n`code` is six digits from the authenticator app. `recovery_code` is one of the\nten strings issued at enrolment, for the operator whose authenticator is in a\ndrawer at home. Exactly one is required, and sending both is a confused client\nrather than a convenience: a request carrying both would have to be resolved\nby a precedence rule, and a precedence rule on a credential check is a way of\nchoosing which of two comparisons an attacker gets to skip.\n\n============================================================\nWHY THE VALIDATION HERE IS SO THIN\n============================================================\n\n`code` is `digits:6` and nothing else -- no \"must be numeric and current\", no\ncheck against the window, no hint about whether the account is even enrolled.\nEvery one of those decisions belongs to TotpAuthenticator, which answers them\nin constant time and returns one sentence for all of the failures. A rule here\nthat refused a well-formed-but-wrong code with a DIFFERENT message from a\nmalformed one would hand a caller a free oracle, one 422 at a time, and it\nwould do it before the rate limiter had counted the attempt.\n\nThe six-digit length is safe to state because it is a fact about the format\nthat every authenticator app in the world already publishes, and refusing a\nfive-character string saves a database read.\n\n`recovery_code` is deliberately loose: the codes are shown grouped in fours\nand get read down a telephone, so hyphens, spaces and lower case all arrive in\npractice. RecoveryCodes::spend() normalises before it digests; a strict\npattern here would refuse a correct credential over its punctuation."
      properties:
        code:
          type:
            - string
            - 'null'
        recovery_code:
          type:
            - string
            - 'null'
          maxLength: 64
      title: SecondFactorChallengeRequest
    ServiceResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        duration_minutes:
          type: integer
        price:
          type: object
          description: "`price_minor` is NOT NULL with a zero default, so there is always\nan amount to publish -- a service with no price is priced at zero,\nwhich is a decision the clinic can legitimately make."
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
          required:
            - amount_minor
            - currency
        modes:
          type: array
          description: "Voice and chat are first-class choices, not fallbacks, so the\nclient needs the full list to offer them as equals."
          items:
            type: string
        eligible_roles:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
      required:
        - id
        - name
        - description
        - duration_minutes
        - price
        - modes
        - eligible_roles
        - is_active
        - created_at
        - updated_at
      title: ServiceResource
    SignInRequest:
      type: object
      description: "Password sign-in, by email address or by phone number.\n\nBOTH, because the two audiences are genuinely different. A clinic administrator sits at\na desk with an email address and expects to type it; a clinician between rooms has their\nphone in their hand and their number is the identifier the clinic already holds. The\nbusiness plan is blunt about the second case: most Ugandan clinic staff have a working\nphone and no reliably checked email address, so neither identifier can be the only way in.\n\nExactly one is required. Sending both is a confused client rather than a convenience,\nand picking one silently would mean two requests that look identical signing in as\ndifferent people.\n\nThis is the ONLY way in, for everybody. Patients sign in here too, with the address\nand the password their clinic issued them at the registration desk -- there is no\nsecond, weaker endpoint that takes a code and no password."
      properties:
        email:
          type:
            - string
            - 'null'
          format: email
          description: "required_without rather than required: either identifies the account, and\nthe pair is mutually exclusive below."
          maxLength: 255
        phone:
          type:
            - string
            - 'null'
        password:
          type: string
          description: "No length or composition rule on the way IN. A minimum here tells an\nattacker the shape of what to guess, and rejects a correct password set\nbefore the rule existed."
      required:
        - password
      title: SignInRequest
    StaffResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        roles:
          type: array
          description: "Roles, not permissions. The matrix is the contract, and a client\nthat reasons about individual permissions will drift from it."
          items:
            type: string
        is_active:
          type: boolean
        phone_verified_at:
          type:
            - string
            - 'null'
          description: "The signal an administrator actually needs while onboarding: an\ninvited colleague who never verified cannot sign in yet."
      required:
        - id
        - name
        - phone
        - email
        - roles
        - is_active
        - phone_verified_at
      title: StaffResource
    StartConsultationRequest:
      type: object
      description: "Starting a consultation.\n\nThe appointment is looked up by id and nothing else. There is no tenant field\nhere or anywhere else in a request body -- tenancy comes from the host or the\nsession, and the `exists` rule runs under row-level security, so an\nappointment belonging to another clinic simply is not there to be found."
      properties:
        appointment_id:
          type: string
        mode_used:
          description: "Optional, and only ever the mode ACTUALLY in use. A clinician who\nknows the patient's connection will not carry video says so at\nthe start rather than after a failed attempt; the booked mode is\nleft untouched as the record of what was agreed."
          $ref: '#/components/schemas/ConsultationMode'
      required:
        - appointment_id
      title: StartConsultationRequest
    StoreAppointmentRequest:
      type: object
      description: 'Books a consultation: patient, clinician, service, slot, mode, fee expectation.'
      properties:
        patient_id:
          type: string
          description: "The exists rules run through the same connection as everything\nelse, so row-level security has already scoped them to this\ntenant: an id belonging to another clinic simply does not exist\nas far as this request is concerned. That is deliberate -- a\n\"belongs to another tenant\" error would confirm the record\nexists somewhere, which is exactly what we do not disclose."
        clinician_id:
          type: string
        service_id:
          type: string
        scheduled_start_at:
          type: string
          format: date-time
        scheduled_end_at:
          type:
            - string
            - 'null'
          format: date-time
          description: "Optional: when absent the slot length comes from the service, which\nis where the clinic already maintains it."
        mode_booked:
          description: "Voice and chat are FIRST-CLASS modes, not degraded fallbacks. A\npatient on a poor connection must be able to choose voice\ndeliberately rather than fight a failing video call."
          $ref: '#/components/schemas/ConsultationMode'
        payment_expectation:
          type: string
          enum:
            - prepaid
            - pay_at_clinic
      required:
        - patient_id
        - clinician_id
        - service_id
        - scheduled_start_at
        - mode_booked
        - payment_expectation
      title: StoreAppointmentRequest
    StoreBreakGlassGrantRequest:
      type: object
      description: "Requesting clinical access to a clinic's records.\n\nFour fields, and none of them is optional in substance:\n\n  tenant_id  — whose records\n  reason     — why, in enough words to be reviewable\n  scope      — which records, from a closed list\n  expires_at — until when, and no longer than a day\n\nA minimum length on the reason is a blunt instrument and is here on purpose.\n\"debug\" satisfies a `required` rule and tells a later reviewer nothing, and\nthese grants are reviewed periodically by someone who was not in the room.\n\nThis is also the one place tenant_id legitimately arrives in a request body.\nEverywhere else in the API it comes from the host or the session — but a\ncross-tenant control surface has no host to read it from, and the operator is\nnaming the clinic they are asking about. Authorisation does not depend on it:\nthe policy grants the ABILITY to request, and the grant that results is\nnotified to the named clinic, which is what makes a wrong or malicious value\nvisible rather than useful."
      properties:
        tenant_id:
          type: string
        reason:
          type: string
          minLength: 20
          maxLength: 1000
        scope:
          type: string
          enum:
            - patient_record
            - consultation
            - clinical_note
            - prescription
            - dispensing
            - delivery
            - payment
            - audit_trail
        expires_at:
          type: string
          format: date-time
          description: "The time box, both ends of it. A grant that starts in the past\nwould be retrospective authorisation, and one that outruns the\nmaximum is standing access wearing an exception's costume."
      required:
        - tenant_id
        - reason
        - scope
        - expires_at
      title: StoreBreakGlassGrantRequest
    StoreClinicalNoteRequest:
      type: object
      description: "Writing a clinical note.\n\nDeliberately permissive about completeness. Drafts persist continuously as\nthey are typed, so this endpoint has to accept a half-finished sentence: a\nlost connection must never lose clinical text, and validation that demanded a\ncomplete note would guarantee it did. Over-structuring the note is also the\nfastest way to make a clinician abandon the system.\n\nWhat it will not accept is a note with no section, because an unclassified\nnote is unreadable to the next clinician."
      properties:
        body:
          type: string
          maxLength: 20000
        note_type:
          type: string
          enum:
            - subjective
            - objective
            - assessment
            - plan
      required:
        - body
      title: StoreClinicalNoteRequest
    StoreClinicianRequest:
      type: object
      description: "Recording a colleague's CLINICAL profile.\n\nThe staff invitation created a person with a role. This is the other half:\nthe registration details without which that person cannot prescribe, and\nwithout which -- because availability is generated per Clinician row -- the\nclinic has nobody to book.\n\n`user_id` is prohibited rather than absent. The clinician is named by the\npath, resolved against the administrator's own tenant, and a body field would\nbe a second way to say the same thing that nothing then checks. `tenant_id`\nis prohibited for the reason it is everywhere else: tenancy comes from the\nhost or the session and never from a payload."
      properties:
        registration_body:
          $ref: '#/components/schemas/RegistrationBody'
        registration_number:
          type:
            - string
            - 'null'
          description: "`present`, not `required`: the empty value is legitimate here. The PRD names the case directly -- a clinician whose registration\nnumber is not to hand is saved with prescribing off and prompted\nto complete it later -- and a clinic that cannot record the\ncolleague at all until someone finds a certificate simply does not\nfinish onboarding.\n\nBut it must be SAID rather than omitted. Leaving the key out of\nthe payload is how a client discovers weeks later that a number it\nthought it sent was never stored; sending it empty is a decision\nthe administrator made."
          maxLength: 100
        practising_licence_expires_at:
          type:
            - string
            - 'null'
          format: date-time
        specialty:
          type:
            - string
            - 'null'
          maxLength: 200
        can_prescribe:
          type: boolean
          description: "Defaults to false, which is the safe direction. The single most\nimportant flag in the system is not one to switch on by omission."
        tenant_id:
          type: string
        user_id:
          type: string
      required:
        - registration_body
        - registration_number
      title: StoreClinicianRequest
    StoreConsentRequest:
      type: object
      description: "One consent decision, for one consent type.\n\nThe shape of this body is the compliance control. Three properties matter:\n\n  1. `consent_type` is singular. There is no array, so no client can bundle\n     three consents behind one tick -- DPPA 2019 requires consent to be\n     specific, and a bundle is not specific.\n  2. `affirmed` is REQUIRED and boolean. There is no default, because a\n     default is the absence of an affirmative action, and the absence of an\n     affirmative action is not consent. Omitting it is a 422, never a grant.\n  3. `policy_version` is required and must match what the server is currently\n     serving. A client showing stale wording collected consent to text we\n     cannot reconstruct, which fails the \"demonstrable\" test outright."
      properties:
        consent_type:
          type: string
          enum:
            - data_processing
            - telemedicine
            - delivery_disclosure
        affirmed:
          type: boolean
        policy_version:
          type: string
          maxLength: 32
        granted_by:
          type: string
          description: "Recorded on the ConsentRecord so the author of the decision\nsurvives in the evidence, not merely the fact of it."
          enum:
            - patient
            - guardian
        guardian_name:
          type: string
          maxLength: 200
        guardian_relationship:
          type: string
          maxLength: 60
      required:
        - consent_type
        - affirmed
        - policy_version
      title: StoreConsentRequest
    StoreDeliveryRequest:
      type: object
      description: "Dispatching a dispensed order.\n\nThe body carries only what a courier needs to find a door: a name, a number,\nan address. There is deliberately no field here for a medicine, an item list\nor a note -- a delivery holds no clinical data, so there is nothing for a\ncareless client to send."
      properties:
        dispense_order_id:
          type: string
        recipient_name:
          type: string
          maxLength: 120
        recipient_phone:
          type: string
        address_text:
          type: string
          description: "A Ugandan delivery address is a sentence and a landmark, not a\nstreet number. \"Opposite Shell Bugolobi\" is how riders actually\nnavigate, so the landmark is a first-class field rather than an\nafterthought appended to the address line."
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 60
        landmark:
          type:
            - string
            - 'null'
          maxLength: 255
      required:
        - dispense_order_id
        - recipient_name
        - recipient_phone
        - address_text
      title: StoreDeliveryRequest
    StorePatientRequest:
      type: object
      description: "Registration: the minimum a clinic needs to contact a person about care.\n\nNote what is NOT required, and never will be: `national_id_number`. Requiring\na NIN excludes patients, and exclusion is a worse outcome than unverified\nidentity ([Identifiers](../20-domain/identifiers-and-numbering.md)).\n\nNote also what is absent: `status`. A patient is created in `pending_consent`\nand moves on only through a consent decision. A client that could post a\nstatus could register an already-consenting patient."
      properties:
        given_name:
          type: string
          maxLength: 100
        family_name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: "Mandatory: the phone is how appointment details, payment prompts\nand prescription-ready notifications reach the patient. Deliberately NOT `unique`. A \"this number is already registered\"\nmessage confirms that a specific person is a patient of this\nclinic, which is itself special-category disclosure under DPPA\n2019. The controller de-duplicates silently instead."
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        date_of_birth:
          type:
            - string
            - 'null'
          format: date-time
        sex:
          type:
            - string
            - 'null'
          enum:
            - female
            - male
            - other
            - prefer_not_to_say
            - null
        national_id_number:
          type:
            - string
            - 'null'
          maxLength: 32
        address:
          type:
            - string
            - 'null'
          maxLength: 255
        district:
          type:
            - string
            - 'null'
          maxLength: 100
        guardian_name:
          type:
            - string
            - 'null'
          maxLength: 200
        guardian_phone:
          type:
            - string
            - 'null'
        guardian_relationship:
          type:
            - string
            - 'null'
          maxLength: 60
      required:
        - given_name
        - family_name
        - phone
      title: StorePatientRequest
    StorePrescriptionRequest:
      type: object
      description: "The prescribing form.\n\nShape only. The two hard preconditions on prescribing — the clinician's\nright to prescribe, and the consultation outcome — are enforced by\nPrescription::issue(), never here: they are domain rules that must hold for\nevery caller, not validation the API layer happens to apply.\n\nThere is deliberately no clinician_id field. A prescription is the act of\nthe authenticated clinician; accepting the identity from the body would let\none clinician sign in another's name."
      properties:
        consultation_id:
          type: string
        items:
          type: array
          description: 'A prescription with no items is not a clinical document.'
          items:
            type: object
            properties:
              medicine_name:
                type: string
                maxLength: 255
              form:
                type:
                  - string
                  - 'null'
                maxLength: 255
              strength:
                type:
                  - string
                  - 'null'
                maxLength: 255
              quantity:
                type: integer
                minimum: 1
              unit:
                type:
                  - string
                  - 'null'
                maxLength: 255
              directions:
                type: string
                maxLength: 2000
              is_controlled:
                type: boolean
                description: "Controlled items are flagged by the clinician. Carevelo does not\nclassify medicines — doing so would be a clinical judgement it\nhas no standing to make."
            required:
              - medicine_name
              - quantity
              - directions
          minItems: 1
      required:
        - consultation_id
        - items
      title: StorePrescriptionRequest
    StoreServiceRequest:
      type: object
      description: "Adds a service to the clinic's own catalogue."
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        price_minor:
          type: integer
          description: 'Integer minor units. Never a float.'
          minimum: 0
          maximum: 100000000000
        currency:
          anyOf:
            -
              $ref: '#/components/schemas/Currency'
            -
              type: 'null'
        modes:
          type:
            - array
