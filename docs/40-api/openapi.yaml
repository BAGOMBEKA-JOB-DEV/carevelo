            - contact_phone
            - contact_email
        amount:
          type: object
        method:
          type: string
        aggregator_reference:
          type:
            - string
            - 'null'
          description: "The line the patient and the clinic can both quote. It is the\naggregator's own reference because the aggregator is the party\nthat actually moved the money."
        paid_at:
          type:
            - string
            - 'null'
        payable:
          type: object
