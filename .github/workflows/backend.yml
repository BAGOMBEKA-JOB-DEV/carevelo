name: backend

on:
  push:
    paths: ['backend/**', 'docs/40-api/openapi.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/40-api/openapi.yaml', '.github/workflows/backend.yml']

# Path-filtered: a frontend-only change never runs the PHP suite.
# A change to the published API contract runs both.
# @see docs/30-architecture/environments-and-deployment.md

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    # Job-level, so EVERY step shares one coherent database configuration.
    #
    # Previously only the migrate step carried credentials, and only the
    # migrator's. That broke in a way that does not reproduce locally: spatie's
    # permission migration flushes its cache, CACHE_STORE=database turns that
    # into a DELETE on the DEFAULT connection, and the default connection was
    # still on .env.example's DB_USERNAME=root with an empty password ->
    # "fe_sendauth: no password supplied". A local Postgres on trust auth
    # accepts that silently; a service container does not.
    #
    # CACHE_STORE=array is the real fix rather than just adding a password:
    # migrations should not depend on a cache TABLE existing, since the cache
    # migration is itself one of the migrations being run.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: carevelo_testing
      DB_USERNAME: carevelo_app
      DB_PASSWORD: app_secret
      DB_MIGRATOR_USERNAME: carevelo_migrator
      DB_MIGRATOR_PASSWORD: migrator_secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # Quoted deliberately. Bare null is a YAML null, which Actions hands to
      # the step as an empty string -- and Laravel needs the literal string
      # "null" to select the null broadcast driver. phpunit.xml already gets
      # this right for the Tests step; this is for the steps that boot the
      # framework without it, like migrate.
      BROADCAST_CONNECTION: "null"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        # Real PostgreSQL, never SQLite. Tenant isolation is enforced by
        # row-level security, and SQLite has none -- the mandatory isolation
        # tests would pass against it while proving nothing.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip
          coverage: none

      - name: Create the two database roles
        env:
          PGPASSWORD: postgres_secret
        run: |
          # The application role must NOT own the tables and must hold
          # NOBYPASSRLS. If it ever owned them, PostgreSQL would exempt it from
          # row-level security and every isolation policy would become silently
          # inert. @see docs/30-architecture/multi-tenancy.md
          psql -h localhost -U postgres -c "CREATE ROLE carevelo_migrator LOGIN PASSWORD 'migrator_secret' NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE ROLE carevelo_app      LOGIN PASSWORD 'app_secret'      NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE carevelo_testing OWNER carevelo_migrator;"
          psql -h localhost -U postgres -d carevelo_testing -c "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
          psql -h localhost -U postgres -d carevelo_testing -c "GRANT ALL ON SCHEMA public TO carevelo_migrator;"
          psql -h localhost -U postgres -d carevelo_testing -c "GRANT USAGE ON SCHEMA public TO carevelo_app;"
          psql -h localhost -U postgres -d carevelo_testing -c "ALTER DEFAULT PRIVILEGES FOR ROLE carevelo_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO carevelo_app;"
          psql -h localhost -U postgres -d carevelo_testing -c "ALTER DEFAULT PRIVILEGES FOR ROLE carevelo_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO carevelo_app;"

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Migrate as the owner role
        # Credentials come from the job-level env above. The application role
        # deliberately has no DDL, so migrations must run on this connection.
        run: php artisan migrate --database=pgsql_migrator --force

      - name: Prove the application role cannot bypass RLS
        # The silent-failure mode: if the app role owned the tables, PostgreSQL
        # would exempt it from row-level security and every isolation policy
        # would be inert while the suite still passed. Assert it here, before
        # any test has a chance to look green for the wrong reason.
        run: |
          php artisan tinker --execute '
            $r = DB::selectOne("select current_user u, (select rolbypassrls from pg_roles where rolname=current_user) b");
            $owner = DB::selectOne("select tableowner from pg_tables where tablename = ?", ["users"]);
            if ($r->u !== "carevelo_app" || $r->b || $owner->tableowner === $r->u) {
                fwrite(STDERR, "RLS role separation is broken: user={$r->u} bypass={$r->b} owner={$owner->tableowner}\n");
                exit(1);
            }
            echo "ok: {$r->u} cannot bypass RLS and owns no table\n";
          '

      # --- Blocking gates. Each catches a class of defect we cannot ship. ---

      - name: API contract is in sync
        # docs/40-api/openapi.yaml is generated from the routes, form requests and
        # resources, and the frontend's client is generated from it in turn. Without
        # this gate a generated-and-committed artefact is just a stale one: the
        # previous hand-written file had drifted to 3 paths against 93 live routes,
        # which is why the frontend had no usable client at all.
        #
        # Runs after migrate because the generator reads column types for model
        # attributes and quietly produces a thinner schema without them.
        run: php artisan api:contract --check

      - name: Style (Pint)
        run: ./vendor/bin/pint --test --format agent

      - name: Static analysis (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        # Includes the non-negotiable categories: cross-tenant isolation across
        # all four scope-bypass paths, schema conformance, connection role,
        # WITH CHECK, audit immutability, forbidden identifiers and rider data
        # minimisation. An isolation-test failure blocks release with no
        # severity discussion available.
        run: php artisan test --compact

      - name: Tree boundary
        # backend/ never contains frontend code and frontend/ never contains
        # PHP. @see docs/70-decisions/0007-separate-backend-frontend-trees.md
        #
        # TRACKED FILES ONLY, via git ls-files. The earlier version walked the
        # filesystem and reported a violation the moment the frontend had
        # dependencies installed: `flatted` ships a PHP port of its own format and
        # Redocly ships a .php test fixture, both inside node_modules, neither
        # committed. The boundary is about what this repository contains, not what
        # npm vendored into an ignored directory.
        #
        # TreeBoundaryTest uses the same command, so the two controls cannot give
        # different answers — which they did, and that is worse than either being
        # wrong on its own.
        working-directory: .
        run: |
          set -e
          test -z "$(git ls-files 'frontend/**/*.php')" \
            || { echo "PHP is tracked under frontend/:"; git ls-files 'frontend/**/*.php'; exit 1; }
          test -z "$(git ls-files 'backend/**/*.blade.php')" \
            || { echo "Blade product views tracked under backend/:"; git ls-files 'backend/**/*.blade.php'; exit 1; }
          echo "tree boundary intact"
