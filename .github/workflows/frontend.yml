name: frontend

on:
  push:
    paths: ['frontend/**', 'docs/40-api/openapi.yaml', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'docs/40-api/openapi.yaml', '.github/workflows/frontend.yml']

# Path-filtered, and the second entry is the one that matters.
#
# `frontend/**` alone would be a hole rather than an optimisation: the generated
# client is checked against docs/40-api/openapi.yaml, which lives OUTSIDE this
# tree. A commit that changes only the published contract would then touch no
# path this workflow watches, skip the job entirely, and report a green tick for
# a client it never revalidated — the exact failure this gate exists to catch.
# So the contract is a trigger for BOTH trees, symmetrically with backend.yml.
#
# Filtered on the file, not `docs/40-api/**`, because openapi.yaml is a
# single self-contained document — it carries no external $ref — so the prose
# beside it (api-conventions.md, endpoint-catalogue.md) cannot change what the
# generator emits. Should the spec ever be split across files, widen this.
#
# @see docs/30-architecture/environments-and-deployment.md
# @see docs/70-decisions/0007-separate-backend-frontend-trees.md

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No version pin here on purpose. `package_json_file` makes the action
          # read `packageManager: pnpm@11.20.0` out of frontend/package.json, so
          # CI and every workstation resolve the same pnpm from one declaration
          # instead of two that can drift. It has to be spelled out because this
          # action is a JS action -- `defaults.run.working-directory` does not
          # apply to it, and there is no package.json at the repository root.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          # engines declares ">=22". Majors only, as with the backend's PHP pin:
          # a patch release should not need a commit here.
          node-version: '22'
          cache: pnpm
          # Also not subject to working-directory, and the lockfile is what the
          # cache key must hash -- keyed on anything coarser, a dependency bump
          # would restore a stale store.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # --- Blocking gates. Each catches a class of defect we cannot ship. ---

      - name: Check (typecheck, lint, boundaries, api client, tests, four builds)
        # One composed script rather than six steps, so `pnpm check` locally and
        # CI cannot disagree about what "checked" means -- the same reasoning that
        # made TreeBoundaryTest and the backend's tree-boundary step share a
        # command. Two controls giving different answers is worse than either
        # being wrong alone.
        #
        # It covers: tsc across every workspace, ESLint at --max-warnings 0, the
        # dependency-cruiser layer and cross-app boundary rules, api-client:check,
        # the @carevelo/ui token tests under Vitest, and a production `next build`
        # of all four apps.
        #
        # No NEXT_PUBLIC_API_ORIGIN. The patient portal reads it in three places
        # (lib/tenant.ts, lib/session.ts, domains/identity/api/session.ts), but
        # each reads it inside a request-time server function and each falls back
        # to `https://${host}`, so no build depends on it. Setting it would be
        # actively wrong rather than merely useless: NEXT_PUBLIC_* is inlined at
        # build time, so a placeholder origin would be baked into the artefacts.
        run: pnpm check

      - name: The booking path stays inside its JavaScript budget
        # docs/30-architecture/frontend-nextjs.md:112 sets a first-load JavaScript budget for
        # the patient portal, seven comments across the tree spend that number to justify a
        # design decision -- the icon set is a server component, the brand mark skips
        # next/image, no web fonts on the critical path -- and until this step existed nothing
        # measured it. A budget nobody measures is the same defect as the lint config that was
        # never run and the console command that was never scheduled: it reads as a control
        # while permitting anything, and this one had already drifted 25KiB past its number.
        #
        # Placed immediately after `pnpm check` because it measures a build rather than
        # producing one. check's last act is a production `next build` of all four apps, so the
        # artefact this reads is already on disk. That is also exactly why `budget` is NOT a
        # member of the composed `check` script: inside it the gate would silently depend on
        # having been invoked after the build within the same run, and a developer running it
        # against a cold tree would get "no production build to measure" where they expected an
        # answer about their bundle.
        #
        # Its own step rather than a line appended to check, so the measurement lands as its own
        # labelled block in the log. The script prints the sizes on success as well as failure,
        # which is the point -- the number is in the log of every run, so a regression is
        # visible as a diff between two build logs rather than only as a red tick on the day the
        # ceiling finally breaks.
        run: pnpm budget

      - name: The generator reproduces the committed client
        # `pnpm check` already ran api-client:check, which regenerates to a temp
        # file and compares -- so this step deliberately does NOT repeat that
        # comparison. What it adds is the other half: proof that the generator
        # itself, run the way a developer is told to run it, lands on exactly the
        # bytes that are committed.
        #
        # They are two different invocations. api-client:check shells out to
        # openapi-typescript from scripts/ with a resolved absolute path and
        # writes to a scratch directory; api-client:generate runs from the package
        # root with a relative path and writes into src/generated/. Nothing
        # compares the second one's output to anything, and a generator whose
        # output nobody compares is the same class of defect as a gate that runs
        # nowhere -- it can drift from the checker for a whole release and the
        # only symptom is that check-in-sync's remediation advice ("run
        # `pnpm api-client:generate` and commit the result") stops fixing the
        # failure it prints.
        #
        # Ordered after `pnpm check` and not before it, because this step MUTATES
        # src/generated/. Run first, it would overwrite the committed client with
        # fresh output and api-client:check would then cheerfully report that the
        # client is in sync with a spec it had already fallen behind.
        run: |
          set -e
          pnpm api-client:generate
          git diff --exit-code -- packages/api-client/src/generated \
            || { echo "api-client:generate does not reproduce the committed client. Commit its output."; exit 1; }
          echo "generator output matches the committed client"

# ---------------------------------------------------------------------------
# THE VISUAL REGRESSION GATE IS NOT WIRED UP HERE, AND THIS IS WHAT IT WOULD TAKE.
#
# `pnpm test:visual` (frontend/e2e/visual.spec.ts) screenshots the key screens
# at two viewports in both themes and diffs them against committed baselines. It
# is the only check that can see a spacing regression re-entering through a class
# or a token, which is the half the ESLint rule in eslint.config.js cannot cover:
# that rule bans the SHAPE `style={{…}}`, and this would catch the EFFECT.
#
# It is not a job yet because it needs a whole running product, not a checkout:
#
#   1. PostgreSQL, migrated. Every page under test reads through the API, and the
#      failure mode when the database is absent is not an error — it is a page
#      that renders empty and screenshots perfectly happily. That is not
#      hypothetical: the first baseline run on this machine produced twelve green
#      PNGs that were all the same empty error page, because Postgres was down.
#      Any job added here MUST assert on real content before it trusts a shot.
#   2. The seeded demo tenant, `kira`, with its two accounts. The specs sign in.
#   3. `php artisan serve` on :8000.
#   4. All four Next dev servers, on the ports in each app's package.json.
#   5. Requests made to `kira.localhost`, never `localhost` — tenancy is resolved
#      from the Host header, so `localhost` renders the 404 page and the spec
#      would pass against it.
#
# Baselines are also platform-specific: Playwright names them `-linux.png`, and
# font rasterisation differs enough between a developer's machine and a runner
# that the two disagree at the pixel level. A real job would generate them inside
# the same container image it asserts in.
#
